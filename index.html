er": "Дві зірки та мета", "text": "Учні отримують зворотний зв’язок, але їм складно визначити, що вже вдається, і над чим варто працювати далі."}, {"lead": "Ситуація Б", "answer": "Навчальні цілі", "text": "Учням потрібна чітка спільна точка орієнтиру, щоб зберігати фокус і мотивацію під час тривалого навчального проєкту."}, {"lead": "Ситуація В", "answer": "Буде ще краще, якщо…", "text": "Учні завершили перший варіант роботи й готові отримати пропозиції, які допоможуть їм удосконалити результат."}, {"lead": "Ситуація Г", "answer": "Критерії успіху", "text": "Учні не впевнені, як виглядає якісна робота, і під час виконання завдання часто запитують, чи «достатньо добре» вони виконують його."}, {"lead": "Ситуація Д", "answer": "SMART-аудит", "text": "Учні формулюють навчальні цілі, але багато з них є надто широкими або нечіткими, щоб спрямовувати щоденне навчання та поступ."}, {"lead": "Ситуація Е", "answer": "Критерії успіху", "text": "Учитель прагне, щоб зворотний зв’язок і самооцінювання спиралися на спільні очікування, а не на особисті враження."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 6<\/h3><p><strong>Перетягніть слова, щоб заповнити пропуски.<\/strong><\/p>", "type": "cloze", "layout": "inline", "paras": [["На початку навчального циклу пан Олександр, учитель інформатики, разом з учнями уточнює ", {"answer": "спільні"}, " цілі та пояснює, чому вони є важливими. Це допомагає учням зрозуміти мету навчання й зберігати фокус."], ["Разом вони розробляють критерії ", {"answer": "успіху"}, ", які описують, як виглядає якісна робота, та спрямовують зусилля під час навчання."], ["Звертаючись до цілей і критеріїв під час виконання завдань, учні можуть ", {"answer": "відстежувати"}, " власний поступ і вносити корективи ще в процесі роботи."], ["Замість того щоб чекати завершення роботи, пан Олександр використовує цілі й критерії для підтримки ", {"answer": "формувального"}, " зворотного зв’язку, який допомагає визначити наступні кроки."], ["З часом учні повертаються до своїх цілей, рефлексують над поступом і починають брати більшу ", {"answer": "відповідальність"}, " за власне навчання."]], "distractors": ["фіксовані", "оцінювання", "оцінювати", "підсумковий", "контроль"], "solution": true}]}, "p2-3x": {"title": "Вправи", "sub": "Модуль 2 · M2.3", "exercises": [{"intro": "<h3>Вправа 1<\/h3><p>Зіставте кожен приклад оцінювання з його <strong>основним призначенням<\/strong>.<\/p>", "type": "cloze", "layout": "pairs", "slotLabel": "Метод", "textLabel": "Основне призначення", "rows": [{"answer": "Вихідне опитування", "text": "Інформувати про наступні кроки у викладанні"}, {"answer": "Діагностика базових знань", "text": "Визначити наявні знання"}, {"answer": "Іпсативне оцінювання", "text": "Відстежувати прогрес у часі"}, {"answer": "Відеосвідчення", "text": "Зафіксувати навчання в дії"}, {"answer": "Презентація поступу", "text": "Оцінити комунікацію та чіткість викладу"}, {"answer": "Метод Фейнмана", "text": "Підтримати рефлексію та саморегуляцію"}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 2<\/h3><p>Оберіть «Правда» або «Неправда» для кожного твердження.<\/p>", "type": "tf", "questions": [{"q": "2.1. Письмові тести — єдиний надійний спосіб оцінити розуміння.", "ok": false, "fbOk": "Правильно. Розуміння може проявлятися різними способами, а вихід за межі письмових тестів допомагає краще побачити, як учні мислять і застосовують ідеї.", "fbBad": "Письмові тести показують лише частину того, що знає учень. Розуміння також може бути продемонстроване через обговорення, практичні завдання, проєкти або пояснення, які розкривають процеси мислення, що часто залишаються непомітними в тестах."}, {"q": "2.2. Відеосвідчення можуть зафіксувати аспекти навчання, які складно побачити в письмових роботах.", "ok": true, "fbOk": "Правильно. Відео робить видимими процеси навчання, зокрема міркування, взаємодію та стратегії розв’язання проблем.", "fbBad": "Відео може показати етапи розв’язання проблем, співпрацю, усне міркування та впевненість. Ці елементи часто залишаються невидимими в письмових відповідях, але є важливими показниками процесу навчання."}, {"q": "2.3. Використання однакового формату оцінювання для всіх учнів завжди гарантує справедливість.", "ok": false, "fbOk": "Правильно. Справедливе оцінювання враховує відмінності між учнями та пропонує різні способи демонстрації розуміння.", "fbBad": "Справедливість не завжди означає однакове ставлення до всіх. Учні мають різні сильні сторони та потреби, і надання різних форматів оцінювання може забезпечити більш рівні можливості для демонстрації навчальних досягнень."}, {"q": "2.4. Множинні форми свідчень зменшують ризик упередженості в оцінюванні.", "ok": true, "fbOk": "Правильно. Використання різних джерел свідчень сприяє більш збалансованим, надійним та інклюзивним рішенням в оцінюванні.", "fbBad": "Покладання лише на один тип свідчень може спотворювати судження. Поєднання різних джерел допомагає врівноважити обмеження, підвищує надійність і підтримує більш точні та інклюзивні рішення в оцінюванні."}]}, {"intro": "<h3>Вправа 3<\/h3><p>Зіставте кожен профіль учня чи учениці з найбільш відповідним методом оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"answer": "Презентація поступу", "text": "Чітко висловлює ідеї усно, але має труднощі з упорядкуванням думок у письмовій формі. Демонструє розуміння під час усного пояснення понять.", "note": "Цей учень може краще демонструвати розуміння через усне або візуальне пояснення, а не через розгорнуте письмове мовлення."}, {"answer": "Рефлексивний щоденник", "text": "Часто осмислює ідеї після уроку, а не під час нього. Отримує користь від повернення до запитань і самостійного обмірковування.", "note": "Ця учениця отримує користь від методів, які дозволяють обдумувати матеріал після уроку, а не лише відповідати одразу."}, {"answer": "Відеосвідчення", "text": "Активно залучається до групової роботи, розвиває ідеї інших і найкраще навчається через обговорення та спільні завдання.", "note": "Навчання цієї учениці стає видимим через взаємодію та спільне обговорення з іншими."}, {"answer": "Іпсативне оцінювання", "text": "Мотивується спостереженням за власним поступом у часі та рефлексією над особистим зростанням, а не порівнянням із ровесниками.", "note": "Цей учень мотивується усвідомленням особистого поступу з часом, а не порівнянням із іншими."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 4<\/h3><p>Перетягніть кожне свідчення у відповідну категорію.<\/p>", "type": "categorize", "zones": [{"label": "Зона 1: Свідчення результату", "correct": ["2", "0"]}, {"label": "Зона 2: Свідчення процесу", "correct": ["3", "4", "1"]}], "cards": [{"id": "0", "text": "Презентація проєкту"}, {"id": "1", "text": "Вихідне опитування"}, {"id": "2", "text": "Діагностика базових знань"}, {"id": "3", "text": "Відеосвідчення"}, {"id": "4", "text": "Іпсативне оцінювання"}], "fbFail": "Спробуйте знову.", "fbFull": "Приділіть хвилину для роздумів: Яка категорія свідчень дає краще уявлення про мислення учнів? Який тип свідчень часто недооцінюється в класах? Що може залишитися непоміченим, якщо збирати лише свідчення результату?"}, {"intro": "<h3>Вправа 5<\/h3><p>Прочитайте кожну ситуацію і зіставте її з найбільш відповідним методом формувального оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"lead": "Ситуація А", "answer": "Діагностика базових знань", "text": "На початку нової теми вчитель хоче зрозуміти, що учні вже знають, у чому почуваються впевнено та де можуть існувати хибні уявлення, перш ніж планувати наступний урок."}, {"lead": "Ситуація Б", "answer": "Іпсативне оцінювання", "text": "Учитель хоче, щоб учні бачили власний поступ у часі, а не порівнювали себе з однокласниками."}, {"lead": "Ситуація В", "answer": "Відеосвідчення", "text": "Учитель прагне зафіксувати співпрацю, практичне застосування знань і залученість під час виконання завдання, а не лише кінцевий результат."}, {"lead": "Ситуація Г", "answer": "Вихідне опитування", "text": "Учні завершують урок, і вчителю потрібен швидкий, чесний зворотний зв’язок, щоб вирішити, як адаптувати наступне заняття."}, {"lead": "Ситуація Д", "answer": "Метод Фейнмана", "text": "Учитель хоче, щоб учні продемонстрували глибоке розуміння, пояснюючи поняття простою мовою та навчаючись завдяки зворотному зв’язку від однолітків."}, {"lead": "Ситуація Е", "answer": "Презентація поступу за 30 секунд", "text": "Учням потрібно чітко й лаконічно сформулювати, чого вони навчилися, зосереджуючись на ключових ідеях, а не на деталях."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 6<\/h3><p>Заповніть пропуски.<\/p>", "type": "cloze", "layout": "inline", "paras": [["Під час вивчення нового навчального модуля вчитель вирішує вийти за межі одного тесту та збирати ", {"answer": "різноманітні"}, " типи свідчень навчання. Деякі учні демонструють своє розуміння через обговорення, інші — через практичні завдання або рефлексію."], ["Пропонуючи різні способи демонстрації ", {"answer": "навчання"}, ", учитель робить оцінювання більш ", {"answer": "інклюзивним"}, " і надає кожному учневі справедливу можливість показати поступ."], ["Замість того щоб зосереджуватися лише на кінцевих ", {"answer": "результатах"}, ", учитель також звертає увагу на ", {"answer": "процес"}, " навчання, спостерігаючи за співпрацею, розв’язанням проблем і постановкою запитань."], ["Для підтримки своєчасного навчання вчитель використовує цифрові інструменти, які забезпечують ", {"answer": "оперативний"}, " зворотний зв’язок і швидке коригування викладання."], ["З часом учні порівнюють свої поточні роботи з попередніми спробами та починають помічати власний ", {"answer": "поступ"}, ", що підвищує впевненість і мотивацію."]], "distractors": ["стандартизовані", "зміст", "бали", "швидкість", "змагання"], "solution": true}]}, "p2-4x": {"title": "Вправи", "sub": "Модуль 2 · M2.4", "exercises": [{"intro": "<h3>Вправа 1<\/h3><p>Зіставте кожен приклад оцінювання з його <strong>основним призначенням<\/strong>.<\/p>", "type": "cloze", "layout": "pairs", "slotLabel": "Метод", "textLabel": "Основне призначення", "rows": [{"answer": "Наставництво з боку колег", "text": "Отримати розуміння через запитання та пропозиції однолітків"}, {"answer": "Структуроване опитування", "text": "Виявити рівень розуміння за допомогою цілеспрямованих запитань"}, {"answer": "Учнівські виставки", "text": "Отримати автентичний зворотний зв’язок від різних аудиторій"}, {"answer": "Знайди відмінності", "text": "Визначити сильні сторони та напрями для вдосконалення"}, {"answer": "SCRUM для навчання", "text": "Ділитися поступом і викликами у співпраці"}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 2<\/h3><p>Оберіть «Правда» або «Неправда» для кожного твердження.<\/p>", "type": "tf", "questions": [{"q": "2.1. Ефективний зворотний зв’язок спрямований на те, щоб допомогти учням зрозуміти, як удосконалити результат, а не лише оцінити, як вони його виконали.", "ok": true, "fbOk": "Правильно. Зворотний зв’язок є найбільш корисним тоді, коли підтримує вдосконалення та спрямовує наступні кроки в навчанні.", "fbBad": "Зворотний зв’язок, який лише описує результат без орієнтації на вдосконалення, має обмежений вплив на навчання"}, {"q": "2.2. Зворотний зв’язок є найефективнішим лише тоді, коли його надають після завершення навчання.", "ok": false, "fbOk": "Правильно. Зворотний зв’язок є більш ефективним тоді, коли його надають у процесі навчання, поки учні ще можуть скористатися ним.", "fbBad": "Очікування до завершення навчання зменшує користь зворотного зв’язку, адже учні можуть не мати можливості застосувати його на практиці."}, {"q": "2.3. Учні відіграють активну роль у наданні та використанні зворотного зв’язку.", "ok": true, "fbOk": "Правильно. Коли учні надають, отримують і використовують зворотний зв’язок, навчання стає більш рефлексивним і самоспрямованим.", "fbBad": "Зворотний зв’язок - це не лише те, що учні отримують. Активна взаємодія з ним зміцнює розуміння та відповідальність за власне навчання."}, {"q": "2.4. Ефективний зворотний зв’язок має бути чітко пов’язаний із навчальними цілями та критеріями успіху.", "ok": true, "fbOk": "Правильно. Співвіднесення зворотного зв’язку з цілями та критеріями допомагає учням зрозуміти, що є важливим і як удосконалити результат.", "fbBad": "Без чіткого зв’язку з цілями та критеріями зворотний зв’язок може бути нечітким або незрозумілим."}, {"q": "2.5. Надання зворотного зв’язку є лише відповідальністю вчителя.", "ok": false, "fbOk": "Правильно. Зворотний зв’язок може надходити від однолітків, самих учнів та інших учасників освітнього процесу, формуючи змістовніший навчальний діалог.", "fbBad": "Зворотний зв’язок є найбільш дієвим тоді, коли він відбувається в різних напрямах, а учні активно залучені до цього процесу."}]}, {"intro": "<h3>Вправа 3<\/h3><p>Зіставте кожен профіль учня з найбільш відповідним методом оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"answer": "SCRUM для навчання", "text": "Отримує користь від регулярного обговорення поступу з однолітками, спільного обговорення труднощів і планування наступних кроків.", "note": "Цьому учневі потрібні структуровані спільні зустрічі, які підтримують рефлексію та колективне розв’язання проблем."}, {"answer": "Структуроване опитування", "text": "Поглиблює розуміння завдяки чітким запитанням, що допомагають пояснювати ідеї та виявляти прогалини в мисленні.", "note": "Цілеспрямовані запитання допомагають зробити мислення учня видимим і підтримують глибше розуміння."}, {"answer": "Учнівські виставки", "text": "Отримує користь від представлення своєї роботи реальній аудиторії та отримання автентичного, змістовного зворотного зв’язку.", "note": "Автентична аудиторія підвищує мотивацію та допомагає учням зрозуміти реальні стандарти якості."}, {"answer": "Знайди відмінності", "text": "Розвиває розуміння, порівнюючи приклади ефективної та неефективної практики й обговорюючи, чому один варіант працює краще.", "note": "Аналіз відмінностей допомагає розпізнати ознаки якісного навчання та визначити напрями для вдосконалення."}, {"answer": "Наставництво з боку колег", "text": "Найкраще навчається через діалог, ставлячи запитання й слухаючи досвід та пропозиції інших.", "note": "Цей учень отримує найбільшу користь від зворотного зв’язку, що виникає в обговоренні та взаємодії з однолітками."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 4<\/h3><p>Перетягніть кожен приклад зворотного зв’язку у відповідну категорію.<\/p>", "type": "categorize", "zones": [{"label": "Зона 1: Ефективний зворотний зв'язок", "correct": ["3", "0", "2", "4"]}, {"label": "Зона 2: Потребує покращення", "correct": ["5", "1", "6", "7"]}], "cards": [{"id": "0", "text": "Гарна командна робота! Зверніть увагу на таймінг."}, {"id": "1", "text": "Твоя робота потребує доопрацювання"}, {"id": "2", "text": "Додай один приклад для підтвердження твоєї думки"}, {"id": "3", "text": "Чітке пояснення! Уточни терміни"}, {"id": "4", "text": "Наступного разу спробуй іншу стратегію"}, {"id": "5", "text": "Молодець!"}, {"id": "6", "text": "Неправильно"}, {"id": "7", "text": "Спробуйте докласти більше зусиль"}], "fbFail": "Спробуй знову.", "fbFull": "Приділіть хвилину для роздумів: Який зворотний зв’язок підказує вам, що робити далі? Який зворотний зв’язок не дає чітких орієнтирів?"}, {"intro": "<h3>Вправа 5<\/h3><p>Прочитайте кожну навчальну ситуацію та зіставте її з найбільш відповідним методом формувального оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"lead": "Ситуація А", "answer": "Структуроване опитування", "text": "Під час уроку вчитель прагне перевірити розуміння та виявити можливі хибні уявлення, поки навчання ще триває."}, {"lead": "Ситуація Б", "answer": "Наставництво з боку колег", "text": "Учні хочуть обговорити свої цілі, труднощі та рішення й отримують користь від запитань і пропозицій однолітків."}, {"lead": "Ситуація В", "answer": "Знайди відмінності", "text": "Учням потрібно визначити, що робить практику ефективною, порівнюючи сильні й слабкі приклади з реальних або змодельованих ситуацій."}, {"lead": "Ситуація Г", "answer": "SCRUM для навчання", "text": "Учні працюють у командах і потребують регулярних коротких обговорень для представлення поступу, визначення перешкод і планування наступних кроків."}, {"lead": "Ситуація Д", "answer": "Учнівські виставки", "text": "Учні готові представити свою роботу та отримати зворотний зв’язок від однолітків, учителів і реальної аудиторії."}, {"lead": "Ситуація Е", "answer": "Структуроване опитування", "text": "Учитель прагне, щоб учні покроково пояснювали своє мислення та обґрунтовували рішення під час виконання завдання."}, {"lead": "Ситуація Є", "answer": "Наставництво з боку колег", "text": "Учні отримують користь, коли дізнаються, як інші підходили до подібних викликів і які стратегії виявилися ефективними."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 6<\/h3><p>Заповніть пропуски, використовуючи подані слова.<\/p>", "type": "cloze", "layout": "inline", "paras": [["Під час практичного навчального завдання пані Марта, учителька англійської мови, надає ", {"answer": "конструктивний"}, " зворотний зв’язок, який допомагає учням зрозуміти, що вже вдається та що варто вдосконалити далі."], ["Замість того щоб чекати завершення роботи, зворотний зв’язок надається ", {"answer": "під час"}, " навчання, щоб учні могли коригувати свої дії в режимі реального часу."], ["Учнів заохочують ", {"answer": "використовувати"}, " зворотний зв’язок: ставити запитання, осмислювати коментарі та пробувати нові підходи."], ["Зворотний зв’язок є найбільш ефективним тоді, коли він чітко пов’язаний із навчальними ", {"answer": "цілями"}, " та спільними критеріями успіху."], ["З часом зворотний зв’язок стає ", {"answer": "двостороннім"}, " процесом, що підтримує рефлексію, діалог і безперервне вдосконалення."]], "distractors": ["підсумковий", "після", "ігнорувати", "бали", "одностороннім"], "solution": true}]}, "p2-5x": {"title": "Вправи", "sub": "Модуль 2 · M2.5", "exercises": [{"intro": "<h3>Вправа 1<\/h3><p>Зіставте кожен приклад оцінювання з його <strong>основним призначенням<\/strong>.<\/p>", "type": "cloze", "layout": "pairs", "slotLabel": "Метод", "textLabel": "Основне призначення", "rows": [{"answer": "Цикл зворотного зв’язку", "text": "Коригувати викладання та навчання на основі свідчень досягнень і зворотного зв’язку"}, {"answer": "Разом ми вчимося більше", "text": "Робити навчання видимим через співпрацю та спільне мислення"}, {"answer": "Карусель зворотного зв’язку", "text": "Поглиблювати розуміння завдяки різним поглядам однолітків"}, {"answer": "А як би ви вчинили?", "text": "Застосовувати зворотний зв’язок для прийняття рішень у нових контекстах"}, {"answer": "Сила «поки що»", "text": "Підтримувати мислення зростання та рефлексію щодо поступу з часом"}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 2<\/h3><p>Оберіть «Правда» або «Неправда» для кожного твердження.<\/p>", "type": "tf", "questions": [{"q": "2.1. Зворотний зв’язок є найефективнішим, коли його використовують для визначення того, що викладати або відпрацьовувати далі.", "ok": true, "fbOk": "Так. Зворотний зв’язок допомагає визначити наступні кроки та скоригувати викладання й навчання тоді, коли ще є можливість вплинути на результат.", "fbBad": "Зворотний зв’язок не обмежується коментарями чи балами. Його сила полягає у впливі на подальші рішення щодо змісту, темпу та способів навчання."}, {"q": "2.2. Використання однакового підходу до зворотного зв’язку в кожній ситуації гарантує кращі результати навчання.", "ok": false, "fbOk": "Саме так. Різні учні, завдання та етапи навчання потребують різних форм зворотного зв’язку для досягнення реального ефекту.", "fbBad": "Універсального способу надання зворотного зв’язку не існує. Його ефективність залежить від контексту, мети та індивідуальних потреб учнів."}, {"q": "2.3. Відповіді учнів, їхні запитання та навіть мовчання можуть надавати корисний зворотний зв’язок для адаптації викладання.", "ok": true, "fbOk": "Так. Такі сигнали допомагають учителю зрозуміти, як просувається навчання та чи потребує воно коригування.", "fbBad": "Зворотний зв’язок не обмежується усними чи письмовими коментарями. Реакції, поведінка та рівень залученості учнів також є важливими джерелами інформації для адаптації викладання."}, {"q": "2.4. Зворотний зв’язок має переважно зосереджуватися на вказуванні помилок після завершення навчання.", "ok": false, "fbOk": "Саме так. Найбільший ефект має зворотний зв’язок, який підтримує вдосконалення під час навчання, коли ще можна вплинути на результат.", "fbBad": "Зворотний зв’язок не зводиться до фіксації помилок. Якщо його надають у процесі навчання, він допомагає спрямувати розвиток і визначити наступні кроки."}, {"q": "2.5. Коли учні використовують зворотний зв’язок, щоб змінити спосіб свого навчання, викладання й навчання стають більш гнучкими та адаптивними.", "ok": true, "fbOk": "Так. Коли учні діють на основі зворотного зв’язку, навчання стає активним і гнучким процесом для всіх учасників.", "fbBad": "Зворотний зв’язок має сенс лише тоді, коли його використовують. Реакція учнів на нього дає змогу коригувати як власні стратегії навчання, так і педагогічні підходи."}]}, {"intro": "<h3>Вправа 3<\/h3><p>Зіставте кожен профіль учня з найбільш відповідним методом оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"answer": "Цикл зворотного зв’язку", "text": "Часто покращує свою роботу після отримання зворотного зв’язку, але має труднощі з самостійним визначенням наступних кроків. Потребує чітких циклів зворотного зв’язку та можливостей для доопрацювання.", "note": "Цій учениці важливо мати структурований процес, а саме отримати зворотний зв’язок, осмислити його, внести зміни та повторно представити результат."}, {"answer": "Разом ми вчимося більше", "text": "Найкраще навчається через обговорення, співпрацю та розвиток ідей інших. Демонструє глибше розуміння, коли навчання є спільним, а не індивідуальним.", "note": "Розуміння цієї учениці розкривається у взаємодії з однолітками, під час спільного обговорення та колективного пошуку рішень."}, {"answer": "Карусель зворотного зв’язку", "text": "Отримує глибше розуміння, коли знайомиться з різними поглядами на ту саму роботу. Більше користі отримує від зворотного зв’язку однолітків, ніж від одного джерела.", "note": "Цьому учневі важливо почути кілька точок зору. Різні коментарі допомагають уточнити ідеї та розширити розуміння."}, {"answer": "А як би ви вчинили?", "text": "Може пояснити, що саме було зроблено неправильно в завданні, але має труднощі із застосуванням зворотного зв’язку в нових або незнайомих ситуаціях без додаткової підтримки.", "note": "Цьому учневі потрібна допомога в перенесенні отриманого зворотного зв’язку в нові контексти та завдання."}, {"answer": "Сила «поки що»", "text": "Відчуває мотивацію, коли бачить власний поступ із часом і рефлексує над особистим зростанням, а не порівнює результати з іншими.", "note": "Ця учниця зміцнює впевненість, коли усвідомлює власний прогрес і розглядає навчання як поступовий процес розвитку."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 4<\/h3><p>Перетягніть кожен елемент до відповідної категорії.<\/p>", "type": "categorize", "zones": [{"label": "Зона 1: Методи, що зосереджені на зворотному зв’язку під час навчання", "correct": ["2", "3", "1"]}, {"label": "Зона 2: Методи, що зосереджені на рефлексії та подальшому вдосконаленні", "correct": ["0", "4"]}], "cards": [{"id": "0", "text": "А як би ви вчинили?"}, {"id": "1", "text": "Карусель зворотного зв’язку"}, {"id": "2", "text": "Цикл зворотного зв’язку"}, {"id": "3", "text": "Разом ми вчимося більше"}, {"id": "4", "text": "Сила «поки що»"}], "fbFail": "Спробуйте знову.", "fbFull": "Знайдіть кілька хвилин для роздумів: Які методи допомагають вам оперативно коригувати викладання? Які з них підтримують учнів у довготривалому використанні зворотного зв’язку? Як можна поєднати методи з обох зон в межах одного уроку, щоб посилити ефект на навчання?"}, {"intro": "<h3>Вправа 5<\/h3><p>Прочитайте кожну навчальну ситуацію та зіставте її з найбільш відповідним методом формувального оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"lead": "Ситуація А", "answer": "Цикл зворотного зв’язку", "text": "На початку нового етапу навчання вчитель збирає швидкі докази розуміння учнів, використовує зворотний зв’язок для коригування плану та створює час, щоб учні могли скористатися цим зворотним зв’язком перед тим, як рухатися далі."}, {"lead": "Ситуація Б", "answer": "Разом ми вчимося більше", "text": "Під час уроку учні працюють у парах і малих групах: пояснюють ідеї, ставлять запитання та розвивають думки одне одного, а вчитель прислухається, щоб скоригувати підтримку та визначити наступні кроки."}, {"lead": "Ситуація В", "answer": "Карусель зворотного зв’язку", "text": "Учні діляться чернеткою своєї роботи та отримують зворотний зв’язок від кількох однолітків, що допомагає їм побачити свою роботу з різних точок зору перед доопрацюванням."}, {"lead": "Ситуація Г", "answer": "А як би ви вчинили?", "text": "Після завершення завдання учням пропонують використати отриманий зворотний зв’язок, щоб визначити, як вони діяли б у подібній, але новій ситуації, зосереджуючись на перенесенні знань, а не лише на виправленні помилок."}, {"lead": "Ситуація Д", "answer": "Сила «поки що»", "text": "Учні переглядають попередні роботи, порівнюють їх із недавніми спробами та рефлексують над тим, як зросло їхнє розуміння, використовуючи зворотний зв’язок для усвідомлення прогресу й визначення особистих цілей."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 6<\/h3><p>Заповніть пропуски, використовуючи подані слова.<\/p>", "type": "cloze", "layout": "inline", "paras": [["Людмила Вікторівна розпочала урок математики про відношення з короткого завдання, щоб ", {"answer": "перевірити"}, " розуміння учнів. Переглянувши відповіді, вона помітила, що багато учнів використовують додавання замість множення."], ["Замість того щоб продовжувати за початковим планом, вона вирішила негайно ", {"answer": "адаптувати"}, " своє викладання. Вона призупинила урок і використала приклади учнів, щоб ", {"answer": "пояснити"}, " різницю між додаванням та множенням."], ["Вона розуміла, що зворотний зв’язок є ефективним лише тоді, коли він призводить до ", {"answer": "змін"}, " у викладанні та навчанні. Саме тому вона скоригувала етапи навчання й додала коротке пояснення, яке допомогло учням знову зосередитися на меті уроку."], ["Замість того щоб зосереджуватися на оцінках, вона надала ", {"answer": "зворотний зв’язок"}, ", у якому пояснила, що учням варто спробувати далі. У результаті учні почали ", {"answer": "відстежувати"}, " власний поступ, раніше ставити запитання та виправляти помилки перед тим, як рухатися далі."]], "distractors": ["оцінювати", "темп", "порівнювати", "завершувати", "змагатися"], "solution": true}]}, "p2-6": {"title": "Опанування циклу формувального оцінювання", "sub": "Модуль 2 · M2.6", "exercises": [{"intro": "<h3>Вправа 1<\/h3><p>Уважно прочитайте кожну проблему та визначте, що саме обмежує видимість навчання або його справедливість. Зіставте її з рішенням, яке найкраще покращує спосіб збирання чи використання свідчень навчання.<\/p><p>На практиці можливі різні варіанти дій, проте оберіть той, що найточніше відповідає описаному виклику.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Рішення:", "rows": [{"text": "Усі учні демонструють своє розуміння однаковим способом, зазвичай через один формат, наприклад письмовий тест. Такий підхід не враховує відмінності в навчальних уподобаннях, сильних сторонах, мовних навичках і рівні впевненості, через що частині учнів складніше показати свої знання.", "answer": "Використовувати різні формати оцінювання"}, {"text": "Оцінювання зосереджується переважно на правильності відповіді та майже не враховує процес мислення. Унаслідок цього міркування, хибні уявлення та навчальні стратегії залишаються непомітними як для вчителя, так і для самих учнів.", "answer": "Додавати завдання на рефлексію та пояснення"}, {"text": "Висновки про результати навчання ґрунтуються лише на одному методі оцінювання. Це підвищує ризик того, що результат відображає обмеження інструменту, а не реальне розуміння чи поступ учня.", "answer": "Поєднувати різні джерела свідчень навчання"}, {"text": "Зворотний зв’язок надається із запізненням після завершення навчальної діяльності. До моменту його отримання учні вже працюють з новим матеріалом, що зменшує можливість коригування та вдосконалення.", "answer": "Використовувати цифрові інструменти для негайного зворотного зв’язку"}], "distractors": [], "solution": false, "fbFail": "Спробуйте знову!", "fbFull": "Тепер, коли ви дізналися, як можна покращити якість свідчень, поміркуйте, як ці дії вписуються в загальний цикл формувального оцінювання."}, {"intro": "<h3>Вправа 2<\/h3><p>Прочитайте короткі навчальні ситуації та розташуйте їх у логічній послідовності циклу формувального оцінювання.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Етап:", "rows": [{"lead": "Крок 1", "answer": "Зібрати свідчення навчання", "text": "Учитель спостерігає за учнями під час виконання завдань, аналізує їхні роботи, слухає обговорення та використовує вікторини, рефлексії або цифрові інструменти. Мета полягає в тому, щоб зафіксувати, що саме учні можуть зробити, пояснити або створити на поточному етапі."}, {"lead": "Крок 2", "answer": "Інтерпретувати свідчення", "text": "Учитель аналізує зібрану інформацію, виявляє закономірності, сильні сторони та типові труднощі. Цей етап передбачає осмислення того, що свідчать дані про рівень розуміння й потреби учнів."}, {"lead": "Крок 3", "answer": "Надати зворотний зв’язок", "text": "Учні отримують чіткі, своєчасні й конкретні коментарі, які допомагають зрозуміти, що вже вдається та що варто вдосконалити. У центрі уваги перебуває навчання, а не виставлення оцінок."}, {"lead": "Крок 4", "answer": "Скоригувати викладання й навчання", "text": "Спираючись на зібрані докази та зворотний зв’язок, учитель і учні вносять зміни. Це може означати додаткове пояснення, надання підтримки, зміну завдань або розширення діяльності для тих, хто готовий рухатися далі."}], "distractors": [], "solution": true}]}, "p2-7": {"doctool": [{"kind": "info", "title": "Інструкція", "html": "<h3>Розроблення циклу формувального оцінювання для конкретного предмета/галузі<\/h3><h4>Інструкція<\/h4><p>Створіть цикл формувального оцінювання для вашого предмета або галузі.<\/p><p>Мета цього завдання – допомогти вам розглянути цикл формувального оцінювання як взаємопов’язаний процес, в якому:<\/p><ul><li>цілі навчання та критерії успішності визначають напрямок навчання;<\/li><li>під час процесу збираються свідчення навчання;<\/li><li>зворотний зв’язок сприяє вдосконаленню;<\/li><li>викладання та навчання адаптуються на основі свідчень.<\/li><\/ul><p>Ви розробите один повний цикл, використовуючи інструменти FormA для підтримки кожного етапу.<\/p>"}, {"kind": "context", "title": "Крок 0: Визначте контекст циклу формувального оцінювання", "intro": "<p>Опишіть контекст викладання та навчання, в якому ви будете розробляти та використовувати цикл формувального оцінювання.<\/p><p>Зосередьтеся на такому:<\/p>", "fields": [{"label": "Предмет / Галузь", "q": "В якому предметі або освітній галузі буде застосовуватися цикл?", "rows": 3}, {"label": "Тема або уміння", "q": "Над чим працюють учні в цьому контексті?", "rows": 3}, {"label": "Учні", "q": "Хто є учнями (вікова група, рівень)?", "rows": 3}, {"label": "Тривалість", "q": "Протягом якого періоду буде застосовуватись цикл формувального оцінювання (частина уроку, повний урок, послідовність уроків)?", "rows": 2}, {"label": "Виклики", "q": "З якими типовими труднощами або невизначеностями стикаються учні в цій темі або галузі?", "rows": 3}, {"label": "Обмеження або можливості", "q": "Які фактори (час, ресурси, навчальне середовище) можуть вплинути на розробку та використання циклу?", "rows": 3}]}, {"kind": "step", "title": "Крок 1: Спільні цілі навчання та критерії успіху", "q": "Чого прагнуть учні і як вони розуміють якість?", "tools": ["Встановлення та обмін цілями навчання", "Спільне створення критеріїв успіху", "Дві зірки та мета", "SMART-аудит", "Буде ще краще, якщо…"], "describe": "<p>Коротко опишіть:<\/p><ul><li>як учні отримують чітке уявлення про цілі навчання та критерії успіху;<\/li><li>як учні беруть участь у формуванні розуміння якості.<\/li><\/ul>", "rows": 8}, {"kind": "step", "title": "Крок 2: Свідчення навчання", "q": "Як навчання стає видимим під час процесу?", "tools": ["Метод Фейнмана*", "Відеосвідчення", "Теорія змін*", "Діагностика базових знань", "Презентація поступу", "Вихідне опитування", "Іпсативне оцінювання"], "describe": "<p>Коротко опишіть:<\/p><ul><li>що роблять учні, щоб продемонструвати свідчення навчання;<\/li><li>як ці свідчення показують розуміння, помилкові уявлення або прогрес.<\/li><\/ul>", "rows": 8}, {"kind": "step", "title": "Крок 3: Зворотний зв’язок під час навчання", "q": "Як зворотний зв’язок використовується для підтримки вдосконалення?", "tools": ["Знайди відмінності", "SCRUM для навчання", "Учнівські виставки", "Наставництво з боку колег*", "Структуроване опитування*"], "describe": "<p>Коротко опишіть:<\/p><ul><li>як надається зворотний зв’язок під час навчання та як його отримують учні;<\/li><li>як зворотний зв’язок пов’язаний із цілями навчання та критеріями успіху.<\/li><\/ul>", "rows": 8}, {"kind": "step", "title": "Крок 4: Адаптація та наступні кроки", "q": "Як зворотний зв’язок впливає на те, що відбувається далі?", "tools": ["Цикл зворотного зв’язку*", "Разом ми вчимося більше", "Карусель зворотного зв’язку", "А як би ви вчинили?", "Сила «поки що»"], "describe": "<p>Коротко опишіть:<\/p>< ує свій прогрес"}, {"id": "3", "text": "Пояснює, що означає якісне виконання, використовуючи критерії успіху"}, {"id": "4", "text": "Обирає, як продемонструвати результат навчання з-поміж кількох варіантів (наприклад, письмово, усно)"}, {"id": "8", "text": "Збирає свідчення навчання під час уроку (а не лише наприкінці)"}, {"id": "9", "text": "Спільно формують критерії успіху для завдання"}, {"id": "10", "text": "Практикує надання зворотного зв’язку відповідно до критеріїв під час взаємо- або самооцінювання"}, {"id": "11", "text": "Демонструє, як ставити рефлексивні запитання щодо навчання"}, {"id": "12", "text": "Порівнює приклади робіт, щоб визначити, яка з них краща, спираючись на критерії успіху"}, {"id": "13", "text": "Визначає, коли класу потрібна пауза або додаткове пояснення, орієнтуючись на сигнали учнів"}, {"id": "14", "text": "Рефлексує щодо власних стратегій навчання: «Що сьогодні допомогло мені навчитися?»"}], "fbFail": "Спробуйте знову.", "fbFull": "Приділіть хвилину для роздумів: Яка зона наразі найбільш представлена у вашій практиці? Яка зона потребує більшої уваги? Що можна змінити, щоб учні активніше долучалися до оцінювання?"}, {"intro": "<h3>Вправа 3<\/h3><p>Прочитайте кожне твердження та визначте, чи є воно правдивим чи хибним. Зосередьтеся на тому, що насправді означає залучення учнів до оцінювання.<\/p>", "type": "tf", "questions": [{"q": "3.1. Учні можуть бути «оцінювачами» лише після того, як повністю опанують матеріал.", "ok": false, "fbOk": "Учні розвивають уміння оцінювання в процесі навчання, а не після повного опанування матеріалу. Ці уміння формуються поступово за умови підтримки.", "fbBad": "Очікування повного опанування матеріалу затримує розвиток навчальної суб’єктності учнів. Вони можуть практикувати уміння оцінювати на будь-якому етапі навчання."}, {"q": "3.2. Залучення учнів до оцінювання допомагає їм краще розуміти навчальні цілі та критерії успіху.", "ok": true, "fbOk": "Коли учні працюють із цілями та критеріями, оцінювання стає більш зрозумілим і змістовним.", "fbBad": "Залучення учнів є ключовим для того, щоб цілі та критерії були зрозумілими та придатними для використання."}, {"q": "3.3. Взаємооцінювання є ефективним саме по собі, навіть якщо учнів не навчають надавати зворотний зв’язок.", "ok": false, "fbOk": "Правильно. Учням потрібні приклади, критерії та практика, щоб надавати змістовний і конкретний зворотний зв’язок.", "fbBad": "Без належної підтримки взаємооцінювання часто залишається поверховим або нечітким."}, {"q": "3.4. Оцінювання як навчання передбачає, що учні використовують оцінювання для підтримки власного навчання.", "ok": true, "fbOk": "Правильно. Оцінювання як навчання підсилює рефлексію, саморегуляцію та відповідальність за власне навчання.", "fbBad": "Оцінювання як навчання — це не про підсумкове судження, а про навчання через оцінювання."}, {"q": "3.5. Надання учням можливості оцінюючи навчатися означає, що вчитель повністю відходить від процесу оцінювання.", "ok": false, "fbOk": "Правильно. Роль учителя змінюється: замість повного контролю він спрямовує та підтримує процес оцінювання.", "fbBad": "Залучення учнів до оцінювання не знімає відповідальності з учителя, а змінює її характер."}]}, {"intro": "<h3>Вправа 4<\/h3><p>Прочитайте кожну навчальну ситуацію та зіставте її з найбільш доречним методом оцінювання, ініційованим учнем або ученицею.<\/p>", "type": "cloze", "layout": "rows", "slotLabel": "Метод:", "rows": [{"lead": "Ситуація А", "answer": "Навчання учнів надавати зворотний зв’язок за критеріями", "text": "Учні надають зворотний зв’язок одноліткам, але коментарі є нечіткими й зосереджені на зусиллях, а не на якості."}, {"lead": "Ситуація Б", "answer": "Порівняльне ранжування (аналіз прикладів робіт)", "text": "Учні виконують завдання, але їм складно пояснити, що означає «якісна» або «дуже якісна» робота."}, {"lead": "Ситуація В", "answer": "Світлофор", "text": "Учні не впевнені, чи зрозуміли матеріал, і вагаються звернутися по допомогу."}, {"lead": "Ситуація Г", "answer": "Самооцінювання за критеріями успіху", "text": "Учні покладаються на вчителя в оцінюванні свого поступу й рідко рефлексують над власним навчанням."}, {"lead": "Ситуація Д", "answer": "Взаємне спостереження з використанням чек-листів", "text": "Учням легше помічати сильні сторони та недоліки в роботах інших, ніж у власних."}, {"lead": "Ситуація Е", "answer": "Ікігай (самооцінювання)", "text": "Учням потрібно уточнити особисті цілі та пов’язати навчання з майбутніми прагненнями."}], "distractors": [], "solution": false}, {"intro": "<h3>Вправа 5<\/h3><p>Прочитайте навчальну ситуацію та оберіть усі елементи, яких бракує для того, щоб учні могли ефективно оцінюючи навчатися.<\/p>", "type": "mset", "questions": [{"lead": "Ситуація 1:", "q": "Учитель пропонує учням оцінити власну роботу наприкінці уроку. Учні швидко ставлять собі високі оцінки, але не можуть пояснити чому і що варто вдосконалити далі.", "ask": "Чого бракує в цій практиці? (Оберіть усі правильні варіанти)", "options": [{"t": "Чіткі критерії успіху", "ok": true}, {"t": "Моделювання самооцінювання", "ok": true}, {"t": "Можливості порівнювати приклади робіт", "ok": true}, {"t": "Час для рефлексії", "ok": false}, {"t": "Більш детальна шкала оцінювання", "ok": false}]}, {"lead": "Ситуація 2:", "q": "Учні регулярно використовують картки «світлофора», щоб показати, чи зрозуміли матеріал. Учитель реагує на червоні сигнали, але учні не обговорюють, чому обрали той чи інший колір і що допоможе їм рухатися далі.", "ask": "Чого бракує в цій практиці? (Оберіть усі правильні варіанти)", "options": [{"t": "Пояснення учнями свого вибору", "ok": true}, {"t": "Уточнювальні запитання", "ok": true}, {"t": "Зв’язок із навчальними цілями", "ok": true}, {"t": "Контроль відповідей з боку вчителя", "ok": false}, {"t": "Можливості для обговорення з однолітками", "ok": true}]}, {"lead": "Ситуація 3:", "q": "Учитель озвучує критерії успіху на початку завдання. Учні виконують завдання, але не звертаються до критеріїв під час роботи або під час перевірки результатів.", "ask": "Чого бракує в цій практиці? (Оберіть усі правильні варіанти)", "options": [{"t": "Залучення учнів до прояснення критеріїв", "ok": true}, {"t": "Використання критеріїв під час навчання", "ok": true}, {"t": "Самоперевірка або взаємоперевірка за критеріями", "ok": true}, {"t": "Чіткі інструкції", "ok": false}, {"t": "Підсумковий зворотний зв’язок учителя", "ok": false}]}], "solution": true}]}, "p3-3": {"doctool": [{"kind": "info", "title": "Інструкція", "html": "<h3>Планування залучення учнів до оцінювання (на двох рівнях)<\/h3><h4>Інструкція<\/h4><p>Розробіть план того, як ви будете залучати учнів до оцінювання на двох рівнях:<\/p><ul><li>у своєму класі – що саме ви робитимете на уроках у межах циклу формувального оцінювання, щоб учні могли оцінюючи навчатися<\/li><li>на рівні школи – що має відбуватися, щоб ці вміння учнів розвивалися і підтримувалися протягом часу<\/li><\/ul><p>Використайте це завдання, щоб перейти від власної практики в класі до формування спільної культури формувального оцінювання.<\/p><h4>Методи, які ви можете обрати<\/h4><p>Використайте одну або кілька з наведених практик, щоб допомогти учням розвивати вміння оцінювання:<\/p><ul><li>Світлофор<\/li><li>Правда й брехня<\/li><li>Взаємне спостереження<\/li><li>Ікігай<\/li><li>Порівняльне ранжування<\/li><li>Вікторини від колег<\/li><li>Перепона<\/li><li>Щоденники навчання<\/li><li>3-2-1<\/li><li>5 Чому й Як<\/li><\/ul>"}, {"kind": "step", "title": "Крок 1: Оберіть уміння, які допоможуть учням оцінюючи навчатися", "describe": "<p>Із наведеного переліку оберіть:<\/p><ul><li>два вміння, які ви будете цілеспрямовано розвивати під час викладання свого предмету;<\/li><li>два або три вміння, які потребують підтримки на рівні школи.<\/li><\/ul>", "groups": [{"key": "gc", "label": "Уміння, які ви розвиватимете у своєму класі", "hint": "оберіть два", "options": ["розуміння навчальних цілей і критеріїв успіху", "самооцінювання власного поступу", "надання зворотного зв’язку одноліткам за критеріями", "використання зворотного зв’язку для вдосконалення роботи", "рефлексія над навчальними стратегіями", "порівняння прикладів робіт для розуміння якості", "постановка рефлексивних та уточнювальних запитань"], "min": 2, "max": 2}, {"key": "gs", "label": "Уміння, які потребують підтримки на рівні школи", "hint": "оберіть два або три", "options": ["розуміння навчальних цілей і критеріїв успіху", "самооцінювання власного поступу", "надання зворотного зв’язку одноліткам за критеріями", "використання зворотного зв’язку для вдосконалення роботи", "рефлексія над навчальними стратегіями", "порівняння прикладів робіт для розуміння якості", "постановка рефлексивних та уточнювальних запитань"], "min": 2, "max": 3}], "note": "Коментар (за потреби): чому саме ці вміння?", "rows": 4}, {"kind": "step", "title": "Крок 2: Планування на рівні класу / навчального предмета", "show": "gc", "groups": [{"key": "gm", "label": "Методи, які ви використаєте", "hint": "одна або кілька практик", "options": ["Світлофор", "Правда й брехня", "Взаємне спостереження", "Ікігай", "Порівняльне ранжування", "Вікторини від колег", "Перепона", "Щоденники навчання", "3-2-1", "5 Чому й Як"], "min": 1, "max": 0}], "describe": "<p>Для обраного вміння опишіть, як ви будете його розвивати у межах циклу формувального оцінювання.<\/p><p>Врахуйте:<\/p><ul><li>на якому етапі циклу (навчальні цілі, свідчення навчання, зворотний зв’язок, адаптація) це вміння буде формуватися;<\/li><li>що саме робитимуть учні;<\/li><li>як ви, як учитель(-ка), будете підтримувати та структурувати цей процес<\/li><\/ul>", "rows": 10}, {"kind": "step", "title": "Крок 3: Планування на рівні школи", "show": "gs", "describe": "<p>Для обраних умінь опишіть, що потрібно, щоб підтримати їх розвиток поза межами окремого класу.<\/p><p>Врахуйте:<\/p><ul><li>спільні підходи або домовленості між предметами<\/li><li>час, регулярні практики або формати, що підтримують рефлексію та зворотний зв’язок<\/li><l function modPct(m){ const its = m.items.filter(i => COUNTABLE.some(c => c.id === i.id)); return [its.filter(i => done[i.id]).length, its.length]; }

}
function renderIndex(cur){

  let h = link(ORDER[0], cur) + INTRO.map(i => link(i, cur)).join('');

       + link({id:m.id, num:'', title:'Огляд модуля', kind:'module'}, cur) + m.items.map(i => link(i, cur)).join('') + '</details>';
  });
  document.getElementById('index').innerHTML = h;

  s += '<text x="100" y="107" text-anchor="middle" font-family="Unbounded,sans-serif" font-weight="700" font-size="20" fill="currentColor">FormA</text></svg>';

}

const TXT = {
  check:'Перевірити', retry:'Повторити', pool:'Картки — перетягніть або натисніть картку, а потім область',
  scoreExplain:'Правильні відповіді додають 1 бал. Неправильні відповіді віднімають 1 бал. Найменша можлива оцінка — 0.',
  prev:'Назад', next:'Далі', finish:'Завершити', result:'Ваш результат:',
  showSol:'Показати розв’язок', yourAns:'Ваша відповідь', rightAns:'Правильна відповідь', noAns:'без відповіді'

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v===false||v==null) continue;
    if (k==='class') n.className=v; else if (k==='html') n.innerHTML=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c => c!=null && n.append(c));
  return n;
};
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function scoreBlock(got,total){
  const s=el('div',{class:'score'}, el('div',{class:'sbar'}, el('i')), el('b',{}, `${got} з ${total}`));
  requestAnimationFrame(()=>s.querySelector('i').style.width=(total?got/total*100:0)+'%');
  return s;
}
function DragTask(item){
  const root = el('div',{class:'dnd'});
  const seq = item.mode==='sequence', table = item.mode==='table', single = item.mode!=='categorize';
  let place = {}, checked = false, selected = null, order = [];
  const zonesWrap = el('div',{class:'zones '+item.mode});
  if(table){
    zonesWrap.style.gridTemplateColumns=`170px repeat(${item.cols.length},minmax(0,1fr))`;
    zonesWrap.append(el('div'), ...item.cols.map(c=>el('div',{class:'th'},c)));
  }
  const zoneEls = item.zones.map((z,i)=>{
    if(table && z.col===0) zonesWrap.append(el('div',{class:'rh'},item.rows[z.row]));
    const lab = table ? null : el('div',{class:'zlabel'}, seq?el('span',{class:'num'},String(i+1)):null, z.label);
    const slot = el('div',{class:'slot'});
    const ze = el('div',{class:'zone',tabindex:'0',role:'group','aria-label':z.label}, lab, slot);
    ze._slot=slot; ze._idx=i;
    ze.addEventListener('click',e=>{ if(e.target.closest('.dcard')) return; dropSelected(i); });
    ze.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===ze){e.preventDefault();dropSelected(i);} });
    zonesWrap.append(ze); return ze;
  });
  const poolSlot = el('div',{class:'slot'});
  const pool = el('div',{class:'pool',tabindex:'0'}, el('div',{class:'ptitle'},TXT.pool), poolSlot);
  pool._idx=null; pool._slot=poolSlot;
  pool.addEventListener('click',e=>{ if(e.target.closest('.dcard')) return; dropSelected(null); });
  pool.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===pool){e.preventDefault();dropSelected(null);} });
  const out = el('div');
  const checkBtn = el('button',{class:'primary',type:'button',onclick:check},TXT.check);
  const retryBtn = el('button',{type:'button',onclick:reset},TXT.retry);
  const actions = el('div',{class:'actions'}, checkBtn, retryBtn);
  root.append(table?el('div',{class:'tablewrap ztw'},zonesWrap):zonesWrap, pool, actions, out);
  const cardEls = {};
  item.cards.forEach(c=>{
    const ce = el('div',{class:'dcard',tabindex:'0',role:'button'}, c.text);
    ce._id=c.id; cardEls[c.id]=ce;
    ce.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSel(c.id);} });
    attachPointer(ce);
  });
  function draw(){
    zoneEls.forEach(z=>z._slot.innerHTML=''); poolSlot.innerHTML='';
    order.forEach(id=>{ const z=place[id]; (z==null?poolSlot:zoneEls[z]._slot).append(cardEls[id]); cardEls[id].classList.toggle('sel',selected===id); });
    pool.style.display = (!checked || order.some(id=>place[id]==null)) ? '' : 'none';
    zoneEls.forEach(z=>z.classList.toggle('target',selected!=null));
    checkBtn.disabled = checked;
  }
  function toggleSel(id){ if(checked) return; selected = selected===id?null:id; draw(); }
  function moveTo(id,zi){
    if(checked) return;
    if(single && zi!=null){ const occ = order.find(x=>place[x]===zi && x!==id); if(occ) place[occ]=place[id] ?? null; }
    place[id]=zi; selected=null; draw();
  }
  function dropSelected(zi){ if(selected!=null) moveTo(selected,zi); }
  function attachPointer(ce){
    let sx,sy,dragging=false,fly=null,offX=0,offY=0,hot=null;
    ce.addEventListener('pointerdown',e=>{ if(checked || e.button>0) return; sx=e.clientX; sy=e.clientY; dragging=false; ce.setPointerCapture(e.pointerId); });
    ce.addEventListener('pointermove',e=>{
      if(sx==null) return;
      if(!dragging && Math.hypot(e.clientX-sx,e.clientY-sy)>6){
        dragging=true; const r=ce.getBoundingClientRect(); offX=sx-r.left; offY=sy-r.top;
        fly=ce.cloneNode(true); fly.className='dcard flying'; fly.style.width=r.width+'px'; document.body.append(fly); ce.classList.add('ghost');
      }
      if(dragging){
        fly.style.left=(e.clientX-offX)+'px'; fly.style.top=(e.clientY-offY)+'px';
        const t=targetAt(e.clientX,e.clientY);
        if(hot!==t){ hot&&hot.classList.remove('hot'); hot=t; hot&&hot.classList.add('hot'); }
      }
    });
    const end=e=>{
      if(sx==null) return;
      if(dragging){ fly.remove(); ce.classList.remove('ghost'); hot&&hot.classList.remove('hot'); const t=targetAt(e.clientX,e.clientY); if(t) moveTo(ce._id,t._idx); }
      else if(e.type==='pointerup') toggleSel(ce._id);
      sx=null; dragging=false; hot=null;
    };
    ce.addEventListener('pointerup',end); ce.addEventListener('pointercancel',end);
  }
  function targetAt(x,y){ const n=document.elementFromPoint(x,y); if(!n) return null; const z=n.closest('.zone,.pool'); return (z && (zoneEls.includes(z)||z===pool)) ? z : null; }
  function check(){
    checked=true; selected=null; let got=0;
    order.forEach(id=>{ const ce=cardEls[id], z=place[id]; ce.classList.remove('ok','bad'); if(z==null) return;
      const ok=item.zones[z].correct.includes(id); got += ok?1:-1; ce.classList.add(ok?'ok':'bad'); });
    got=Math.max(0,got); const total=item.cards.length;
    draw(); out.innerHTML='';
    actions.insertBefore(scoreBlock(got,total), retryBtn.nextSibling);
    out.append(el('div',{class:'feedback'}, got===total?item.fbFull:item.fbFail), el('div',{class:'explain'},TXT.scoreExplain));
    item._report && item._report(got,total);
  }
  function reset(){
    checked=false; selected=null; out.innerHTML=''; actions.querySelector('.score')?.remove();
    order=shuffle(item.cards.map(c=>c.id)); order.forEach(id=>{place[id]=null; cardEls[id].classList.remove('ok','bad');}); draw();
  }
  reset(); return root;
}
function QuizTask(item){
  const root=el('div',{class:'quiz'}); const qs=item.questions; const tf=item.kind==='tf';
  let ans, cur, fin;
  const correctIdx = q => q.options.findIndex(o=>o.ok);
  const isOk = i => ans[i]!=null && qs[i].options[ans[i]].ok;
  const fbText = (q,a) => tf ? (q.options[a].ok?q.fbOk:q.fbBad) : q.options[a].fb;
  function draw(){
    root.innerHTML=''; if(fin) return drawResult();
    const dots=el('div',{class:'dots'}, qs.map((_,i)=>el('button',{type:'button',
      class:[i===cur?'cur':'', ans[i]!=null?(isOk(i)?'ok':'bad'):''].join(' '), 'aria-label':`Питання ${i+1}`, onclick:()=>{cur=i;draw();}}, String(i+1))));
    const q=qs[cur], a=ans[cur], ci=correctIdx(q);
    const opts=el('div',{class:'opts'+(tf?' tf':'')}, q.options.map((o,i)=>{
      let cls=''; if(a!=null){ if(i===a) cls=o.ok?'ok':'bad'; else if(i===ci) cls='right'; }
      return el('button',{type:'button',class:cls, onclick:()=>{ if(ans[cur]==null){ans[cur]=i;draw();} }, ...(a!=null?{disabled:''}:{})}, (tf?(i===0?'✅ ':'❌ '):'')+o.t);
    }));
    root.append(dots, el('p',{class:'qtext'},`${cur+1}. ${q.q}`), opts);
    if(a!=null){ const t=fbText(q,a); if(t) root.append(el('div',{class:'qfb '+(q.options[a].ok?'ok':'bad')},t)); }
    const last=cur===qs.length-1;
    root.append(el('div',{class:'qnav'},
      el('button',{type:'button',onclick:()=>{cur--;draw();}, ...(cur===0?{disabled:''}:{})},TXT.prev),
      last ? el('button',{type:'button',class:'primary',onclick:()=>{fin=true;draw();}},TXT.finish)
           : el('button',{type:'button',class:'primary',onclick:()=>{cur++;draw();}},TXT.next)));
  }
  function drawResult(){
    const got=qs.reduce((s,_,i)=>s+(isOk(i)?1:0),0);
    item._report && item._report(got,qs.length);
    const list=el('ul',{class:'review',hidden:''}, qs.map((q,i)=>{ const a=ans[i], ci=correctIdx(q);
      return el('li',{class:isOk(i)?'ok':'bad'}, `${i+1}. ${q.q}`, el('div',{class:'ans'}, `${TXT.yourAns}: ${a==null?TXT.noAns:q.options[a].t} · ${TXT.rightAns}: ${q.options[ci].t}`)); }));
    const solBtn=el('button',{type:'button',onclick:()=>{list.hidden=!list.hidden;}},TXT.showSol);
    root.append(el('div',{class:'result'}, el('h4',{},TXT.result), el('div',{class:'actions'}, scoreBlock(got,qs.length)),
      el('div',{class:'actions'}, solBtn, el('button',{type:'button',onclick:reset},TXT.retry)), list));
  }
  function reset(){ ans=qs.map(()=>null); cur=0; fin=false; draw(); }
  reset(); return root;
}
function buildExercises(host, data, onReport){
  if (data && data.questions) return buildQuiz(host, data, onReport);
  if (data && data.exercises) return buildEx2(host, data.exercises, onReport);
  let k = 0;
  data.forEach(sec=>sec.items.forEach(it=>{ if(it.type!=='iframe'){ const idx=k++; it._report = onReport ? (g,t)=>onReport(idx,g,t,k) : null; } }));
  data.forEach(sec=>{
    const s=el('section',{class:'ex'}, el('div',{class:'intro',html:sec.intro}));
    sec.items.forEach(it=>{
      if(it.title) s.append(el('h4',{class:'subtitle'},it.title));
      if(it.type==='drag') s.append(DragTask(it));

      else if(it.type==='iframe') s.append(el('div',{class:'extlink',html:`<span>Ця вправа розміщена на сервісі LearningApps і відкривається в новій вкладці.</span><a class="lbtn" href="${it.src}" target="_blank" rel="noopener">Відкрити вправу на LearningApps ↗</a>`}));
    });
    host.append(s);
  });
}

function testReporter(o){
  const res = {};
  return (idx, got, total, count) => {
    res[idx] = [got, total];
    if (Object.keys(res).length < count) { document.getElementById('testscore').innerHTML = testScoreHTML(o.id) + `<p class="hint">Виконано завдань: ${Object.keys(res).length} із ${count}</p>`; return; }
    const g = Object.values(res).reduce((a, r) => a + r[0], 0), t = Object.values(res).reduce((a, r) => a + r[1], 0);
    const pct = Math.round(g / t * 100), prev = store.get('score-'+o.id, null);
    if (!prev || pct > prev.pct) store.set('score-'+o.id, {pct, at: new Date().toISOString()});
    if (pct >= passOf(o.id) && !done[o.id]) { done[o.id] = true; store.set('done', done); renderIndex(o.id); const db = document.getElementById('donebtn'); if (db) { db.setAttribute('aria-pressed','true'); db.textContent = '✓ Виконано'; db.previousElementSibling.textContent = 'Цей крок позначено як виконаний.'; } }
    document.getElementById('testscore').innerHTML = `<p>Результат цієї спроби: <strong>${pct}%</strong></p>` + testScoreHTML(o.id);
  };
}

/* ---------- completion code ----------
   The code is an HMAC of the participant's e-mail and completion date.
   It is checked on the trainers' page (#verify). The key lives in this page,
   so it guards against mistakes and casual edits, not against someone who reads the source. */
const K = ['Fm','A-ua','-26','::sx','7Qp','v4m'].join('');
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const normEmail = e => String(e || '').trim().toLowerCase();
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normEmail(e));
async function sig(email, d){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(K), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(normEmail(email) + '|FormA|' + d)));
  let bits = 0n; for (let i = 0; i < 5; i++) bits = (bits << 8n) | BigInt(mac[i]);
  let out = ''; for (let i = 0; i < 8; i++) { out = B32[Number(bits & 31n)] + out; bits >>= 5n; }
  return out.slice(0,4) + '-' + out.slice(4);
}
async function makeCode(email, d){ return `FA-${d}-${await sig(email, d)}`; }
async function checkCode(email, code){
  const m = String(code || '').trim().toUpperCase().replace(/\s+/g,'').match(/^FA-(\d{6})-([0-9A-Z]{4})-?([0-9A-Z]{4})$/);
  if (!m || !validEmail(email)) return {ok:false, why:'неправильний формат'};
  const ok = (await sig(email, m[1])) === m[2] + '-' + m[3];
  const d = m[1]; return {ok, date: `${d.slice(4,6)}.${d.slice(2,4)}.20${d.slice(0,2)}`, why: ok ? '' : 'код не відповідає цій адресі'};
}
function reqStatus(r){
  if (r.type === 'form') { const a = store.get('sa-'+r.phase, {}); const n = Object.keys(a).length; return {ok: n === QUESTIONS.length, note: n === QUESTIONS.length ? 'заповнено' : `відповідей: ${n} із ${QUESTIONS.length}`}; }
  if (r.type === 'test') {
    if (!EX[r.id]) return {ok:false, wait:true, note:'тест ще не додано на сайт'};
    const sc = store.get('score-'+r.id, null); return {ok: !!sc && sc.pct >= r.pass, note: sc ? `найкращий результат ${sc.pct}%` : 'ще не пройдено'};
  }

const pw = n => { const a=n%10,b=n%100; return (a===1&&b!==11)?'бал':(a>=2&&a<=4&&(b<10||b>=20))?'бали':'балів'; };
function zone2(cls=''){ const s=el('div',{class:'slot'}); const z=el('div',{class:'zone '+cls},s); z._slot=s; return z; }
function poolBox(title){ const s=el('div',{class:'slot'}); const p=el('div',{class:'pool'},el('div',{class:'ptitle'},title),s); p._slot=s; return p; }
function scoreRow(got,max){ const s=el('div',{class:'score'},el('div',{class:'sbar'},el('i')),el('b',{},`${got} з ${max} ${pw(max)}`)); requestAnimationFrame(()=>s.querySelector('i').style.width=(max?got/max*100:0)+'%'); return s; }
function DnD(cards, zoneEls, pool, {multi=false}={}){
  const all=[...zoneEls,pool], cardEls={}; let place={}, order=[], selected=null, locked=false;
  cards.forEach(c=>{ const ce=el('div',{class:'dcard',tabindex:'0',role:'button'},c.text); ce._id=c.id; cardEls[c.id]=ce;
    ce.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(c.id);}}); pointer(ce); });
  all.forEach((z,i)=>{ z._idx=z===pool?null:i; z.tabIndex=0;
    z.addEventListener('click',e=>{if(!e.target.closest('.dcard'))drop(z._idx);});
    z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===z){e.preventDefault();drop(z._idx);}}); });
  function draw(){ all.forEach(z=>z._slot.querySelectorAll('.dcard:not(.sol)').forEach(n=>n.remove()));
    order.forEach(id=>{(place[id]==null?pool:zoneEls[place[id]])._slot.append(cardEls[id]);cardEls[id].classList.toggle('sel',selected===id);});
    pool.hidden=locked&&order.every(id=>place[id]!=null); }
  function toggle(id){if(locked)return;selected=selected===id?null:id;draw();}
  function move(id,zi){ if(locked)return; if(!multi&&zi!=null){const occ=order.find(x=>place[x]===zi&&x!==id); if(occ)place[occ]=place[id]??null;}
    place[id]=zi;selected=null;draw(); api.onchange&&api.onchange(); }

  function pointer(ce){
    let sx=null,sy,drag=false,fly,ox,oy,hot=null;
    ce.addEventListener('pointerdown',e=>{if(locked||e.button>0)return;sx=e.clientX;sy=e.clientY;drag=false;ce.setPointerCapture(e.pointerId);});
    ce.addEventListener('pointermove',e=>{ if(sx==null)return;
      if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){ drag=true;const r=ce.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
        fly=ce.cloneNode(true);fly.className='dcard flying';fly.style.width=r.width+'px';document.body.append(fly);ce.classList.add('ghost'); }
      if(drag){fly.style.left=(e.clientX-ox)+'px';fly.style.top=(e.clientY-oy)+'px';
        const t=at(e.clientX,e.clientY);if(hot!==t){hot&&hot.classList.remove('hot');hot=t;hot&&hot.classList.add('hot');}} });
    const end=e=>{ if(sx==null)return;
      if(drag){fly.remove();ce.classList.remove('ghost');hot&&hot.classList.remove('hot');const t=at(e.clientX,e.clientY);if(t)move(ce._id,t._idx);}

  const api={ place:()=>place, inZone:zi=>order.filter(id=>place[id]===zi),
    reset(){locked=false;selected=null;all.forEach(z=>z._slot.querySelectorAll('.sol').forEach(n=>n.remove()));
      order=shuffle(cards.map(c=>c.id));order.forEach(id=>{place[id]=null;cardEls[id].classList.remove('ok','bad');});draw();},
    lock(){locked=true;selected=null;draw();}, mark(id,ok){cardEls[id].classList.add(ok?'ok':'bad');} };

}
function controls(root,{check,reset,solution,fbFull,fbFail,report}){

function Cloze(ex){

function buildQuiz(host, DATA, onReport){
  const QS=DATA.questions, app=el('div',{class:'qz'}); host.append(el('section',{class:'ex'},
    el('p',{class:'qsub'},`${QS.length} запитань · для зарахування потрібно ${passOf(DATA._id) || DATA.pass}%`), app));
  function makeQuestion(q, idx){
    const body=el('div'); const head=[el('div',{class:'qnum'},`Запитання ${idx+1} із ${QS.length}`), el('p',{class:'qq'},q.q)]; let api;
    if(q.type==='single'||q.type==='multi'){
      const multi=q.type==='multi', nOk=q.options.filter(o=>o.ok).length, order=shuffle(q.options.map((_,i)=>i)), chosen=new Set(); let locked=false;
      const name='q'+idx+'-'+Math.random().toString(36).slice(2,7);
      const rows=order.map(i=>{ const inp=el('input',{type:multi?'checkbox':'radio',name}); const row=el('label',{class:'opt'}, inp, el('span',{},q.options[i].t), el('span',{class:'mark'}));
        inp.addEventListener('change',()=>{ if(locked) return; if(!multi) chosen.clear(); inp.checked?chosen.add(i):chosen.delete(i); paint(); api.onchange&&api.onchange(); });
        row._i=i; row._inp=inp; return row; });
      function paint(){ rows.forEach(r=>r.classList.toggle('chosen',chosen.has(r._i))); }
      head.push(el('p',{class:'qhint'}, multi?(q.hideCount?'Оберіть усі правильні відповіді.':`Оберіть кілька відповідей (правильних: ${nOk}).`):'Оберіть одну відповідь.'));
      body.append(el('div',{class:'opts2'},rows));
      api={ max:multi?nOk:1, answered:()=>chosen.size>0,
        score(){ let sc=0; chosen.forEach(i=>sc+=q.options[i].ok?1:-1); return multi?Math.max(0,sc):(sc>0?1:0); },
        lock(){ locked=true; rows.forEach(r=>{ r._inp.disabled=true; r.classList.add('locked');
          if(chosen.has(r._i)){ const ok=q.options[r._i].ok; r.classList.remove('chosen'); r.classList.add(ok?'ok':'bad'); r.querySelector('.mark').textContent=ok?'✓':'✗'; } }); },
        yours:()=>chosen.size?[...chosen].map(i=>q.options[i].t).join('; '):null, right:()=>q.options.filter(o=>o.ok).map(o=>o.t).join('; ') };
    } else if(q.type==='blanks'){
      const words=[...q.items.map(it=>it.answer),...(q.distractors||[])].map((t,i)=>({id:String(i),text:t}));
      const zones=q.items.map(()=>zone2()); const pool=poolBox('Варіанти: перетягніть або натисніть варіант, а потім поле');
      head.push(el('p',{class:'qhint'},`Перетягніть варіант у поле «${(q.label||'Відповідь:').replace(':','')}» біля кожного пункту.`));
      body.append(el('div',{class:'blanks'}, q.items.map((it,i)=>el('div',{class:'blank'}, el('p',{class:'sit'},it.text), el('div',{class:'ansline'}, el('span',{},q.label||'Відповідь:'), zones[i])))), pool);
      const d=DnD(words,zones,pool); const textOf=id=>words[+id].text; const inZone=zi=>Object.keys(d.place()).find(id=>d.place()[id]===zi);
      api={ max:q.items.length, answered:()=>Object.values(d.place()).some(v=>v!=null),
        score(){ return q.items.reduce((sc,it,zi)=>{ const id=inZone(zi); return sc+(id!=null&&textOf(id)===it.answer?1:0); },0); },
        lock(){ d.lock(); q.items.forEach((it,zi)=>{ const id=inZone(zi); if(id!=null) d.mark(id,textOf(id)===it.answer); }); },
        yours(){ return this.answered()? q.items.map((_,zi)=>{const id=inZone(zi); return `${zi+1}) ${id!=null?textOf(id):'—'}`;}).join('; '):null; },
        right:()=>q.items.map((it,i)=>`${i+1}) ${it.answer}`).join('; ') };

    else if (o.kind === 'ex') h += `<div class="exw" id="exw"></div>`;
    else if (o.kind === 'doctool') h += `<div class="exw dt" id="dt"></div>`;
    else if (o.kind === 'test') h += `<p class="content">Прохідний результат — ${passOf(o.id)}%. Тест можна проходити повторно, зараховується найкращий результат.</p><div class="testscore" id="testscore">${testScoreHTML(o.id)}</div><div class="exw" id="exw"></div>`;
    else if (o.kind === 'cert') h += certView();
    else if (o.kind === 'h5p') h += h5pView(o);
    else if (o.kind === 'form') h += formView(o);
  }
  if (o.kind !== 'home') h += footer(o);
  v.innerHTML = h;
  if (CAN_EMBED) v.querySelectorAll('a.video').forEach(a => { const id = new URL(a.href).searchParams.get('v'); const f = document.createElement('iframe'); f.className = 'video'; f.src = 'https://www.youtube-nocookie.com/embed/' + id; f.title = 'Відео YouTube'; f.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; f.allowFullscreen = true; f.loading = 'lazy'; a.replaceWith(f); });
  renderIndex(id);
  wire(o);
  document.body.classList.remove('open'); document.getElementById('menu').setAttribute('aria-expanded','false');
  window.scrollTo(0, 0);
}
function wire(o){
  const b = document.getElementById('donebtn');
  if (b) b.onclick = () => {
    const nowDone = !done[o.id];
    if (nowDone) done[o.id] = true; else delete done[o.id];
    store.set('done', done);
    const next = ORDER[ORDER.indexOf(o) + 1];
    if (nowDone && next) location.hash = next.id; else render();
  };
  const ex = document.getElementById('exw');
  if (EX[o.ex] && EX[o.ex].questions) EX[o.ex]._id = o.id;
  if (ex && o.kind === 'test') buildExercises(ex, EX[o.ex], testReporter(o));
  else if (ex) buildExercises(ex, EX[o.ex]);
  if (o.kind === 'cert') wireCert();
  if (o.kind === 'doctool') buildDocTool(document.getElementById('dt'), EX[o.ex], o.id);
  if (o.tool === 'verify') wireVerify();
  const rb = document.getElementById('rubric');
  if (rb) wireRubric(rb, o.id);
  const tp = document.getElementById('template');
  if (tp) wireTemplate(tp, o.id);
  const t = document.getElementById('notes');
  if (t) {
    let tm; t.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { store.set('note-'+o.id, t.value); document.getElementById('notemsg').textContent = 'Збережено в цьому браузері.'; }, 400); };
    document.getElementById('copynote').onclick = async () => { const m = document.getElementById('notemsg');
      try { await navigator.clipboard.writeText(t.value); m.textContent = 'Скопійовано.'; } catch(e) { t.select(); m.textContent = 'Текст виділено: натисніть Ctrl+C, щоб скопіювати.'; } };
  }
  const f = document.getElementById('sa');
  if (f) {
    const upd = () => { const ans = {}; QUESTIONS.forEach((q, i) => { const c = f.querySelector(`input[name="q${i}"]:checked`); if (c) ans[i] = +c.value; });
      store.set('sa-'+o.phase, ans); const n = Object.keys(ans).length;
      document.getElementById('savedmsg').textContent = n === QUESTIONS.length ? '✓ Усі відповіді збережено в цьому браузері.' : `Відповіді: ${n} із ${QUESTIONS.length}`;
      if (n === QUESTIONS.length && !done[o.id]) { done[o.id] = true; store.set('done', done); renderIndex(o.id); const db = document.getElementById('donebtn'); if (db){ db.setAttribute('aria-pressed','true'); db.textContent='✓ Виконано'; } }
      const c = document.getElementById('compare'); if (c) c.innerHTML = compareHTML(); };
    f.onchange = upd;
    const c = document.getElementById('compare'); if (c) c.innerHTML = compareHTML();
  }
}
document.getElementById('menu').onclick = () => { const o = document.body.classList.toggle('open'); document.getElementById('menu').setAttribute('aria-expanded', o); };
window.addEventListener('hashchange', render);
render();
</script>
</body>
