<script>
const DATA = {"P": {"p1.3": "<p>Ця сторінка містить вбудоване відео. Скористайтеся програвачем нижче, а потім виконайте запропоновані завдання під час перегляду та після його завершення. Збережіть свої нотатки.<\/p>\n<div class=\"box mint\">\n<p>1) Поміркуйте та запишіть власне поточне розуміння таких питань:<\/p>\n<ul><li>Що таке формувальне оцінювання?<\/li><li>Чим воно відрізняється від підсумкового оцінювання?<\/li><li>Яку роль мають відігравати здобувачі освіти в процесі оцінювання?<\/li><li>Як ви зазвичай перевіряєте розуміння матеріалу учнями?<\/li><\/ul>\n<\/div>\n<div class=\"box rose\">\n<p>2) Перегляньте вбудоване відео. Спочатку подивіться його один раз без детальних нотаток, а потім перегляньте повторно, ставлячи на паузу щоразу, коли почуєте ключову ідею або приклад застосування методу формувального оцінювання в класі пані Коваль.<\/p>\n<a class=\"video\" href=\"https://www.youtube.com/watch?v=E8TRa1KofzI\" rel=\"noopener\" target=\"_blank\"><img alt=\"Кадр із відео\" loading=\"lazy\" src=\"img/yt-E8TRa1KofzI.jpg\"/><span aria-hidden=\"true\" class=\"play\"><\/span><span class=\"vcap\">▶ Дивитися відео · Відео відкриється на YouTube у новій вкладці<\/span><\/a><p>Для кожного методу коротко зазначте:<\/p>\n<ul><li>Якою була його мета?<\/li><li>Які докази (свідчення навчання) він дозволив отримати?<\/li><li>Як він сприяв залученню учнів до процесу навчання та оцінювання?<\/li><li>Чи чули ви раніше про цей метод або використовували його?<\/li><\/ul>\n<\/div>\n<div class=\"box peach\">\n<p>3) Скористайтеся посиланням, щоб ознайомитися з методами каталогу інструментів <strong>FormA<\/strong>, про які йдеться у відео: <a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/82EMlY1zCju5w7c4TUC4KtCusJASuxIk\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a><\/p>\n<div class=\"badges\"><figure><img alt=\"Перепона\" loading=\"lazy\" src=\"img/m-tripwire.png\"/><figcaption>Перепона<\/figcaption><\/figure><figure><img alt=\"Вікторини від колег\" loading=\"lazy\" src=\"img/m-peer-quizzes.png\"/><figcaption>Вікторини від колег<\/figcaption><\/figure><figure><img alt=\"Сценарії для обговорення\" loading=\"lazy\" src=\"img/m-incidental-scenario.png\"/><figcaption>Сценарії для обговорення<\/figcaption><\/figure><figure><img alt=\"Картки з афірмаціями\" loading=\"lazy\" src=\"img/m-affirmation-card.png\"/><figcaption>Картки з афірмаціями<\/figcaption><\/figure><figure><img alt=\"5 Чому й Як\" loading=\"lazy\" src=\"img/m-5-whys-and-hows.png\"/><figcaption>5 Чому й Як<\/figcaption><\/figure><figure><img alt=\"3-2-1\" loading=\"lazy\" src=\"img/m-3-2-1.png\"/><figcaption>3-2-1<\/figcaption><\/figure><\/div>\n<p>Ознайомлюючись із каталогом, визначте принаймні два методи, які, на вашу думку, є актуальними для вашого навчального контексту. Для кожного обраного методу коротко зазначте:<\/p>\n<ul><li>Яку навчальну проблему цей метод допоможе вам вирішити?<\/li><li>На якому етапі уроку ви б його застосували: на початку, в середині чи наприкінці?<\/li><li>Які аспекти мислення учнів або свідчення їх навчання цей метод допоможе виявити?<\/li><li>Як учні можуть брати активну участь у цьому процесі?<\/li><\/ul>\n<\/div>\n<div class=\"box mint\">\n<p>4) Після перегляду поміркуйте над тим, що ви щойно дізналися.<\/p>\n<ul><li>Чому залучення учнів є принципово важливим?<\/li><li>Який приклад із відео видався вам найпереконливішим і чому?<\/li><li>Як ви могли б адаптувати його до власного педагогічного контексту?<\/li><li>Які зміни в культурі вашого закладу освіти були б необхідні для повноцінного впровадження формувального оцінювання?<\/li><li>Яка підтримка вам була би потрібна, щоб впевнено застосовувати цей метод?<\/li><\/ul>\n<\/div>", "p2.1": "<p>Формувальне оцінювання має проектуватись як безперервний процес, що допомагає учням і вчителям осмислювати навчання, своєчасно його коригувати та рухатися вперед із чітким розумінням подальших кроків. Різні елементи та інструменти працюють разом як замкнений цикл, у якому кожен етап інформує наступний.<\/p>\n<br/>\n<h3>Елемент 3. Створення спільних навчальних цілей і критеріїв успіху<small>Навіщо ми це вивчаємо і як виглядає успіх?<\/small><\/h3>\n<div class=\"badges\"><figure><img alt=\"Навчальні цілі\" loading=\"lazy\" src=\"img/m-learning-goals.png\"/><figcaption>Навчальні цілі<\/figcaption><\/figure><figure><img alt=\"Критерії успіху\" loading=\"lazy\" src=\"img/m-success-criteria.png\"/><figcaption>Критерії успіху<\/figcaption><\/figure><figure><img alt=\"Дві зірки та мета\" loading=\"lazy\" src=\"img/m-two-stars-and-a-goal.png\"/><figcaption>Дві зірки та мета<\/figcaption><\/figure><figure><img alt=\"SMART-аудит\" loading=\"lazy\" src=\"img/m-smart-audit.png\"/><figcaption>SMART-аудит<\/figcaption><\/figure><figure><img alt=\"Буде ще краще, якщо…\" loading=\"lazy\" src=\"img/m-even-better-if.png\"/><figcaption>Буде ще краще, якщо…<\/figcaption><\/figure><\/div>\n<p>Цикл починається з формування спільного розуміння навчальних цілей і критеріїв успіху. Учням не просто повідомляють, що від них очікується; вони активно залучаються до уточнення того, як виглядає успіх і чому це важливо. На цьому етапі навчання набуває цілеспрямованого характеру. Учні розуміють, до чого вони прагнуть і за якими критеріями оцінюватиметься їхній прогрес, зокрема й ними самими.<\/p><p>Цей елемент закладає основу для відповідальності учнів за власне навчання та саморегуляції, які є необхідними для всіх наступних етапів циклу.<\/p>\n<hr/>\n<h3>Елемент 4. Формувальне оцінювання для фіксації різноманітного навчального прогресу<small>Які свідчення навчання ми маємо на цей момент?<\/small><\/h3>\n<div class=\"badges\"><figure><img alt=\"Метод Фейнмана\" loading=\"lazy\" src=\"img/m-feynman-technique.png\"/><figcaption>Метод Фейнмана<\/figcaption><\/figure><figure><img alt=\"Відеосвідчення\" loading=\"lazy\" src=\"img/m-video-evidence.png\"/><figcaption>Відеосвідчення<\/figcaption><\/figure><figure><img alt=\"Теорія змін\" loading=\"lazy\" src=\"img/m-theory-of-change.png\"/><figcaption>Теорія змін<\/figcaption><\/figure><figure><img alt=\"Діагностика базових знань\" loading=\"lazy\" src=\"img/m-background-knowledge-probe.png\"/><figcaption>Діагностика базових знань<\/figcaption><\/figure><figure><img alt=\"Презентація поступу\" loading=\"lazy\" src=\"img/m-pitching-progress.png\"/><figcaption>Презентація поступу<\/figcaption><\/figure><figure><img alt=\"Вихідне опитування\" loading=\"lazy\" src=\"img/m-exit-poll.png\"/><figcaption>Вихідне опитування<\/figcaption><\/figure><figure><img alt=\"Іпсативне оцінювання\" loading=\"lazy\" src=\"img/m-ipsative-assessment.png\"/><figcaption>Іпсативне оцінювання<\/figcaption><\/figure><\/div>\n<p>Коли навчальні цілі стають чіткими й зрозумілими, увага переходить до збирання свідчень навчання способами, що не обмежуються тестами чи балами. Йдеться про уважне спостереження за тим, як розгортається навчання, та використання різних джерел свідчень, щоб виявити рівень розуміння, можливі хибні уявлення, докладені зусилля й поступ учнів. <\/p><p>Різноманітні методи дають змогу вчителям і учням бачити навчання з різних ракурсів. Такі підходи надають перевагу поясненню, рефлексії та зіставленню з власними попередніми результатами, а не порівнянню з іншими.<\/p><p>У центрі уваги перебуває різноманітність свідчень і форм зворотного зв’язку з низьким рівнем ризику, які допомагають зробити навчання видимим, не зупиняючи його природного перебігу.<\/p>\n<hr/>\n<h3>Елемент 5. Надання та отримання ефективного зворотного зв’язку<small>Що нам говорять свідчення і як вони можуть допомогти нам покращитися?<\/small><\/h3>\n<div class=\"badges\"><figure><img alt=\"Знайди відмінності\" loading=\"lazy\" src=\"img/m-spot-the-difference.png\"/><figcaption>Знайди відмінності<\/figcaption><\/figure><figure><img alt=\"SCRUM\" loading=\"lazy\" src=\"img/m-scrum.png\"/><figcaption>SCRUM<\/figcaption><\/figure><figure><img alt=\"Учнівські виставки\" loading=\"lazy\" src=\"img/m-learner-centred-exhibitions.png\"/><figcaption>Учнівські виставки<\/figcaption><\/figure><figure><img alt=\"Наставництво з боку колег\" loading=\"lazy\" src=\"img/m-peer-mentoring.png\"/><figcaption>Наставництво з боку колег<\/figcaption><\/figure><figure><img alt=\"Структуроване опитування\" loading=\"lazy\" src=\"img/m-structured-questioning.png\"/><figcaption>Структуроване опитування<\/figcaption><\/figure><\/div>\n<p>Свідчення набувають цінності лише тоді, коли їх осмислюють і перетворюють на дієвий зворотний зв’язок. Цей елемент акцентує увагу на зворотному зв’язку як на діалозі, а не як на виставленні оцінок. Він є своєчасним, конкретним і безпосередньо пов’язаним зі спільно визначеними цілями та критеріями.<\/p><p>Учні виступають активними учасниками процесу: вони навчаються надавати, приймати й використовувати зворотний зв’язок як невід’ємну частину власного навчання. Саме на цьому етапі зворотний зв’язок допомагає їм усвідомити, де вони перебувають зараз, що вже працює ефективно та над чим варто працювати далі.<\/p>\n<hr/>\n<h3>Елемент 6. Використання зворотного зв’язку для адаптації навчання й викладання<small>Що ми змінюємо далі і як рухаємося вперед?<\/small><\/h3>\n<div class=\"badges\"><figure><img alt=\"Цикл зворотного зв’язку\" loading=\"lazy\" src=\"img/m-formative-feedback-loop.png\"/><figcaption>Цикл зворотного зв’язку<\/figcaption><\/figure><figure><img alt=\"Разом ми вчимося більше\" loading=\"lazy\" src=\"img/m-together-we-learn-more.png\"/><figcaption>Разом ми вчимося більше<\/figcaption><\/figure><figure><img alt=\"Карусель зворотного зв’язку\" loading=\"lazy\" src=\"img/m-feedback-carousel.png\"/><figcaption>Карусель зворотного зв’язку<\/figcaption><\/figure><figure><img alt=\"А як би ви вчинили?\" loading=\"lazy\" src=\"img/m-how-would-you.png\"/><figcaption>А як би ви вчинили?<\/figcaption><\/figure><figure><img alt=\"Сила «поки що»\" loading=\"lazy\" src=\"img/m-the-power-of-yet.png\"/><figcaption>Сила «поки що»<\/figcaption><\/figure><\/div>\n<p>Цикл завершується тоді, коли зворотний зв’язок переходить в усвідомлені дії. Цей етап зосереджений на використанні отриманої інформації для коригування стратегій викладання, навчальних завдань і підходів учнів до навчання. Саме тут рефлексія стає основою для прийняття рішень.<\/p><p>Різні види діяльності спонукають і вчителів, і учнів сприймати навчання як гнучкий процес, відкритий до вдосконалення. Зміни можуть включати уточнення цілей, перегляд методів, надання додаткової підтримки або створення нових викликів.<\/p><p>Водночас цей етап природно переходить у наступний цикл визначення цілей і збирання свідчень, забезпечуючи безперервність, чутливість до потреб і динамічний розвиток навчання.<\/p>\n<hr/>\n<p>Формувальне оцінювання не є лінійним переліком дій. Це динамічний цикл, що починається зі спільного розуміння мети, передбачає збирання змістовних свідчень, створення якісного зворотного зв’язку та приводить до обґрунтованої адаптації. У разі системного повторення цей цикл зміцнює навчальну суб’єктність учнів, підсилює педагогічні рішення та підтримує сталий поступ кожного.<\/p>\nПропонуємо розпочати з вибору <strong>одного <\/strong>елемента циклу формувального оцінювання FormA та глибоко його опрацювати. Зосередження на окремому компоненті допомагає впевнено стартувати, експериментувати та помічати конкретні зміни у власній практиці без перевантаження. Ви можете обрати той елемент, який найбільше відповідає вашому поточному контексту, потребам учнів або викликам, що виникають у класі.\n<p>Водночас варто поступово досліджувати всі елементи у власному темпі, вибудовуючи між ними зв’язки та формуючи підхід до формувального оцінювання, що органічно працює саме для вас і ваших учнів.<\/p>", "p2.2": "<p>Створення спільних навчальних цілей і критеріїв успіху відіграє ключову роль у наданні навчанню цілеспрямованого та прозорого характеру. Цей етап циклу формувального оцінювання зосереджується на тому, щоб допомогти учням усвідомити, навіщо вони опановують певний матеріал і за якими ознаками буде визначено успіх. Замість того щоб отримувати цілі як готові інструкції, учні з самого початку беруть участь в їх формулюванні.<\/p>\n<p>Коли навчальні цілі й критерії успіху є спільними та зрозумілими, учні беруть відповідальність за власний поступ. Вони можуть перевіряти власне розуміння, рефлексувати над роботою та приймати обґрунтовані рішення щодо вдосконалення виконаного завдання. Тоді учні можуть розпізнавати успіх, обговорювати його й цілеспрямовано досягати, а не сприймати лише як результат, визначений наприкінці. <\/p>\n<p>Відео на цій сторінці демонструє практичні підходи до формулювання та спільного узгодження навчальних цілей, розроблення критеріїв успіху разом з учнями й використання їх для підтримки зворотного зв’язку та саморегуляції. Ви побачите, як спільно створені критерії, SMART-аудит і прості процедури зворотного зв’язку, допомагають учням зосередитися на головному та зрозуміти, як рухатися вперед. Ці практики є універсальними, застосовними в різних предметах і вікових групах та ефективно працюють в очному, змішаному й онлайн-навчанні.<\/p>\n<hr/>\n<p>Перегляньте відео двічі: спершу без нотаток, потім - із паузами на ключових ідеях і прикладах методів формувального оцінювання.<\/p>\n<a class=\"video\" href=\"https://www.youtube.com/watch?v=k0Vy4zipdL8\" rel=\"noopener\" target=\"_blank\"><img alt=\"Кадр із відео\" loading=\"lazy\" src=\"img/yt-k0Vy4zipdL8.jpg\"/><span aria-hidden=\"true\" class=\"play\"><\/span><span class=\"vcap\">▶ Дивитися відео · Відео відкриється на YouTube у новій вкладці<\/span><\/a>\n<p>Для кожного методу коротко зазначте:<\/p>\n<ul><li>Якою була його мета?<\/li><li>Які свідчення навчання він дав змогу отримати?<\/li><li>Як він сприяв залученню учнів?<\/li><li>Чи знайомий вам цей метод і чи використовували ви його раніше?<\/li><\/ul>\n<hr/>\n<p>Перейдіть за посиланням і ознайомтеся з методами каталогу <strong>FormA<\/strong>, згаданими у відео - (<a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/4Z8NjyPp80DhHKzj-iLGYWpGk5Hxqrkb\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a>) <\/p>\n<div class=\"badges\"><figure><img alt=\"Навчальні цілі\" loading=\"lazy\" src=\"img/m-learning-goals.png\"/><figcaption>Навчальні цілі<\/figcaption><\/figure><figure><img alt=\"Критерії успіху\" loading=\"lazy\" src=\"img/m-success-criteria.png\"/><figcaption>Критерії успіху<\/figcaption><\/figure><figure><img alt=\"Дві зірки та мета\" loading=\"lazy\" src=\"img/m-two-stars-and-a-goal.png\"/><figcaption>Дві зірки та мета<\/figcaption><\/figure><figure><img alt=\"SMART-аудит\" loading=\"lazy\" src=\"img/m-smart-audit.png\"/><figcaption>SMART-аудит<\/figcaption><\/figure><figure><img alt=\"Буде ще краще, якщо…\" loading=\"lazy\" src=\"img/m-even-better-if.png\"/><figcaption>Буде ще краще, якщо…<\/figcaption><\/figure><\/div>\n<hr/>\n<p>Ознайомлюючись з каталогом, оберіть щонайменше <strong>два методи<\/strong>, які є релевантними для вашого педагогічного контексту.<\/p>\n<p>Для кожного обраного методу коротко зазначте:<\/p>\n<ul><li>Яку навчальну проблему або виклик він може допомогти вам розв’язати?<\/li><li>На якому етапі уроку ви б його використали: на початку, у середині чи наприкінці?<\/li><li>Що ви зможете зрозуміти про навчання учнів завдяки цьому методу?<\/li><li>Як учні братимуть активну участь у процесі?<\/li><li>Яка підтримка вам потрібна, щоб упевнено застосувати цей метод?<\/li><\/ul>", "p2.3": "<p>Формувальне оцінювання є найдієвішим тоді, коли воно дає змогу бачити навчання в його розвитку, а не лише фіксувати результат наприкінці. У центрі уваги перебуває збирання свідчень навчання у спосіб, що є гнучким, інклюзивним і значущим для різних учнів. Замість опори на один інструмент, формувальний підхід передбачає уважність до розуміння, можливих хибних уявлень, докладених зусиль і поступу через різноманітні сигнали.<\/p>\n<p>Відео на цій сторінці демонструє підходи, які допомагають учителям збирати змістовні свідчення без переривання навчального процесу. Ви побачите, як короткі, безпечні за рівнем напруження види діяльності дають змогу виявити, що учні вже знають, як вони мислять і якої підтримки потребують далі. Ці практики універсальні, застосовні в різних предметах і вікових групах та легко адаптуються до очного, змішаного й онлайн навчання.<\/p>\n<hr/>\n<p>Перегляньте відео двічі: спершу без нотаток, потім - із паузами на ключових ідеях і прикладах методів формувального оцінювання<\/p>\n<a class=\"video\" href=\"https://www.youtube.com/watch?v=5mWCHd4XshA\" rel=\"noopener\" target=\"_blank\"><img alt=\"Кадр із відео\" loading=\"lazy\" src=\"img/yt-5mWCHd4XshA.jpg\"/><span aria-hidden=\"true\" class=\"play\"><\/span><span class=\"vcap\">▶ Дивитися відео · Відео відкриється на YouTube у новій вкладці<\/span><\/a>\n<p>Для кожного методу коротко зазначте:<\/p>\n<ul><li>Якою була його мета?<\/li><li>Які свідчення навчання він дав змогу отримати?<\/li><li>Як він сприяв залученню учнів?<\/li><li>Чи знайомий вам цей метод і чи використовували ви його раніше?<\/li><\/ul>\n<hr/>\n<p>Перейдіть за посиланням і ознайомтеся з методами каталогу <strong>FormA<\/strong>, згаданими у відео - (<a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/O08hU3WySHWqE_eUkKZyGgO6Q_AoDZXw\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a>) <\/p>\n<div class=\"badges\"><figure><img alt=\"Метод Фейнмана\" loading=\"lazy\" src=\"img/m-feynman-technique.png\"/><figcaption>Метод Фейнмана<\/figcaption><\/figure><figure><img alt=\"Відеосвідчення\" loading=\"lazy\" src=\"img/m-video-evidence.png\"/><figcaption>Відеосвідчення<\/figcaption><\/figure><figure><img alt=\"Теорія змін\" loading=\"lazy\" src=\"img/m-theory-of-change.png\"/><figcaption>Теорія змін<\/figcaption><\/figure><figure><img alt=\"Діагностика базових знань\" loading=\"lazy\" src=\"img/m-background-knowledge-probe.png\"/><figcaption>Діагностика базових знань<\/figcaption><\/figure><figure><img alt=\"Презентація поступу\" loading=\"lazy\" src=\"img/m-pitching-progress.png\"/><figcaption>Презентація поступу<\/figcaption><\/figure><figure><img alt=\"Вихідне опитування\" loading=\"lazy\" src=\"img/m-exit-poll.png\"/><figcaption>Вихідне опитування<\/figcaption><\/figure><figure><img alt=\"Іпсативне оцінювання\" loading=\"lazy\" src=\"img/m-ipsative-assessment.png\"/><figcaption>Іпсативне оцінювання<\/figcaption><\/figure><\/div>\n<hr/>\n<p>Ознайомлюючись з каталогом, оберіть щонайменше <strong>два методи<\/strong>, які є релевантними для вашого педагогічного контексту.<\/p>\n<p>Для кожного обраного методу коротко зазначте:<\/p>\n<ul><li>Яку навчальну проблему або виклик він може допомогти вам розв’язати?<\/li><li>На якому етапі уроку ви б його використали: на початку, у середині чи наприкінці?<\/li><li>Що ви зможете зрозуміти про навчання учнів завдяки цьому методу?<\/li><li>Як учні братимуть активну участь у процесі?<\/li><li>Яка підтримка вам потрібна, щоб упевнено застосувати цей метод?<\/li><\/ul>", "p2.4": "<p>Надання та отримання ефективного зворотного зв’язку є центральним елементом циклу формувального оцінювання. Зворотний зв’язок поєднує свідчення навчання з рішеннями щодо подальших дій, роблячи навчання видимим і дієвим як для учнів, так і для педагогів. На цьому етапі зворотний зв’язок розглядається не як підсумкове судження, а як складова безперервного навчального діалогу.<\/p>\n<p>Ефективний зворотний зв’язок є своєчасним, конкретним і чітко пов’язаним зі спільними навчальними цілями та критеріями успіху. Він допомагає учням зрозуміти, що вже вдається, на якому етапі вони перебувають і як можуть удосконалити результат. Водночас зворотний зв’язок надає вчителю цінну інформацію про рівень розуміння, залученість і потреби учнів, що допомагає приймати обґрунтовані педагогічні рішення.<\/p>\n<p>Цей елемент розглядає зворотний зв’язок як двосторонній процес. Учні виступають активними учасниками: вони надають, отримують і використовують зворотний зв’язок, тоді як педагоги демонструють ефективні практики його надання та реагують на відповіді й потреби учнів. У центрі уваги - зворотний зв’язок, що підтримує рефлексію, зростання та безперервне вдосконалення, а не порівняння чи виставлення оцінок.<\/p>\n<p>Відео на цій сторінці представляє практичні підходи до надання та отримання зворотного зв’язку у спосіб, що є конструктивним, доречним і чутливим до потреб навчання. Ви побачите, як діалог, взаємооцінювання, структуровані запитання та автентичні навчальні ситуації підсилюють практики зворотного зв’язку в різних предметах і вікових групах, а також в очному, змішаному й цифровому форматах навчання.<\/p>\n<hr/>\n<p>Перегляньте відео двічі: спершу без нотаток, потім - із паузами на ключових ідеях і прикладах методів формувального оцінювання.<\/p>\n<a class=\"video\" href=\"https://www.youtube.com/watch?v=riBo-05NQm0\" rel=\"noopener\" target=\"_blank\"><img alt=\"Кадр із відео\" loading=\"lazy\" src=\"img/yt-riBo-05NQm0.jpg\"/><span aria-hidden=\"true\" class=\"play\"><\/span><span class=\"vcap\">▶ Дивитися відео · Відео відкриється на YouTube у новій вкладці<\/span><\/a>\n<p>Для кожного методу коротко зазначте:<\/p>\n<ul><li>Якою була його мета?<\/li><li>Які свідчення навчання він дав змогу отримати?<\/li><li>Як він сприяв залученню учнів?<\/li><li>Чи знайомий вам цей метод і чи використовували ви його раніше?<\/li><\/ul>\n<hr/>\n<p>Перейдіть за посиланням і ознайомтеся з методами каталогу <strong>FormA<\/strong>, згаданими у відео - (<a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/jubGEOCZ_9-j33DhHWY9CVommpkEUJ6W\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a>) <\/p>\n<div class=\"badges\"><figure><img alt=\"Знайди відмінності\" loading=\"lazy\" src=\"img/m-spot-the-difference.png\"/><figcaption>Знайди відмінності<\/figcaption><\/figure><figure><img alt=\"SCRUM\" loading=\"lazy\" src=\"img/m-scrum.png\"/><figcaption>SCRUM<\/figcaption><\/figure><figure><img alt=\"Учнівські виставки\" loading=\"lazy\" src=\"img/m-learner-centred-exhibitions.png\"/><figcaption>Учнівські виставки<\/figcaption><\/figure><figure><img alt=\"Наставництво з боку колег\" loading=\"lazy\" src=\"img/m-peer-mentoring.png\"/><figcaption>Наставництво з боку колег<\/figcaption><\/figure><figure><img alt=\"Структуроване опитування\" loading=\"lazy\" src=\"img/m-structured-questioning.png\"/><figcaption>Структуроване опитування<\/figcaption><\/figure><\/div>\n<hr/>\n<p>Ознайомлюючись з каталогом, оберіть щонайменше <strong>два методи<\/strong>, які є релевантними для вашого педагогічного контексту.<\/p>\n<p>Для кожного обраного методу коротко зазначте:<\/p>\n<ul><li>Яку навчальну проблему або виклик він може допомогти вам розв’язати?<\/li><li>На якому етапі уроку ви б його використали: на початку, у середині чи наприкінці?<\/li><li>Що ви зможете зрозуміти про навчання учнів завдяки цьому методу?<\/li><li>Як учні братимуть активну участь у процесі?<\/li><li>Яка підтримка вам потрібна, щоб упевнено застосувати цей метод?<\/li><\/ul>", "p2.5": "<p>Ефективний зворотний зв’язок має цінність лише тоді, коли він спричиняє реальні зміни у викладанні та навчанні. Зворотний зв’язок і подальша адаптація взаємодіють, перетворюючи оцінювання на інструмент розвитку. Якісний зворотний зв’язок є своєчасним, конкретним і пов’язаним із навчальними цілями. Він допомагає учням усвідомити, на якому етапі вони перебувають, які прогалини чи хибні уявлення потребують уваги та які наступні кроки сприятимуть поступу.<\/p>\n<p>Водночас зворотний зв’язок є джерелом інформації і для вчителя. Повторювані помилки чи непорозуміння сигналізують про потребу переглянути пояснення, змінити стратегії, використати альтернативні ресурси або надати адресну підтримку. Така гнучкість забезпечує відповідність навчання актуальним потребам учнів.<\/p>\n<p>Цей процес має циклічний характер. Безперервні цикли зворотного зв’язку та адаптації підтримують поступове вдосконалення й розвиток мислення зростання. Виклики сприймаються як можливості для подальшого навчання, а не як остаточний підсумок.<\/p>\n<hr/>\n<p>Перегляньте відео двічі: спершу без нотаток, потім - із паузами на ключових ідеях і прикладах методів формувального оцінювання.<\/p>\n<a class=\"video\" href=\"https://www.youtube.com/watch?v=FH67oQIXBrc\" rel=\"noopener\" target=\"_blank\"><img alt=\"Кадр із відео\" loading=\"lazy\" src=\"img/yt-FH67oQIXBrc.jpg\"/><span aria-hidden=\"true\" class=\"play\"><\/span><span class=\"vcap\">▶ Дивитися відео · Відео відкриється на YouTube у новій вкладці<\/span><\/a>\n<p>Для кожного методу коротко зазначте:<\/p>\n<ul><li>Якою була його мета?<\/li><li>Які свідчення навчання він дав змогу отримати?<\/li><li>Як він сприяв залученню учнів?<\/li><li>Чи знайомий вам цей метод і чи використовували ви його раніше?<\/li><\/ul>\n<hr/>\n<p>Перейдіть за посиланням і ознайомтеся з методами каталогу <strong>FormA<\/strong>, згаданими у відео - (<a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/y_rn9aRsiy8W8X1ciA5OvkxYP6c6H2Nv\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a>) <\/p>\n<div class=\"badges\"><figure><img alt=\"Цикл зворотного зв’язку\" loading=\"lazy\" src=\"img/m-formative-feedback-loop.png\"/><figcaption>Цикл зворотного зв’язку<\/figcaption><\/figure><figure><img alt=\"Разом ми вчимося більше\" loading=\"lazy\" src=\"img/m-together-we-learn-more.png\"/><figcaption>Разом ми вчимося більше<\/figcaption><\/figure><figure><img alt=\"Карусель зворотного зв’язку\" loading=\"lazy\" src=\"img/m-feedback-carousel.png\"/><figcaption>Карусель зворотного зв’язку<\/figcaption><\/figure><figure><img alt=\"А як би ви вчинили?\" loading=\"lazy\" src=\"img/m-how-would-you.png\"/><figcaption>А як би ви вчинили?<\/figcaption><\/figure><figure><img alt=\"Сила «поки що»\" loading=\"lazy\" src=\"img/m-the-power-of-yet.png\"/><figcaption>Сила «поки що»<\/figcaption><\/figure><\/div>\n<hr/>\n<p>Ознайомлюючись з каталогом, оберіть щонайменше <strong>два методи<\/strong>, які є релевантними для вашого педагогічного контексту.<\/p>\n<p>Для кожного обраного методу коротко зазначте:<\/p>\n<ul><li>Яку навчальну проблему або виклик він може допомогти вам розв’язати?<\/li><li>На якому етапі уроку ви б його використали: на початку, у середині чи наприкінці?<\/li><li>Що ви зможете зрозуміти про навчання учнів завдяки цьому методу?<\/li><li>Як учні братимуть активну участь у процесі?<\/li><li>Яка підтримка вам потрібна, щоб упевнено застосувати цей метод?<\/li><\/ul>", "p3.1": "<p>Формувальне оцінювання стає по-справжньому дієвим тоді, коли учні активно залучені до оцінювання власного навчання - не лише як ті, хто отримує зворотний зв’язок, а й як його повноцінні учасники. У цьому елементі акцент зміщується від оцінювання як дії, спрямованої на учнів, до оцінювання як діяльності, яку здійснюють самі учні в процесі навчання.<\/p>\n<p>Надання учням можливості оцінюючи навчатися означає підтримку їх у розумінні власної та взаємної ролі в постановці й досягненні навчальних цілей, визначенні критеріїв успіху, застосуванні різних способів оцінювання та використанні цього розуміння для прийняття обґрунтованих рішень щодо власного навчання. Коли учні залучені до обговорення того, що саме оцінюється, як збираються свідчення навчання і що означає якісний результат, оцінювання стає змістовною частиною навчання, а не окремим підсумковим судженням.<\/p>\n<p>Ключовою ідеєю цього елементу циклу формувального оцінювання є оцінювання як навчання. У цьому підході оцінювання використовується не лише для відстеження поступу, а й для поглиблення розуміння, розвитку метакогнітивних умінь і посилення саморегуляції.<\/p>\n<p>Виконання цієї ролі може здаватися складним, однак формувальне оцінювання не є додатковим завданням. Воно спирається на вже знайомі вчителю практики - такі як запитання, обговорення та зворотний зв’язок - і інтегрується в них, роблячи їх більш цілеспрямованими та орієнтованими на учня.<\/p>\n<p>Коли учні беруть на себе роль оцінювачів, вони розвивають уміння, що виходять за межі окремих уроків чи предметів. Це, зокрема, розуміння якості добре виконаного завдання, надання й отримання зворотного зв’язку, рефлексія щодо навчальних стратегій і використання свідчень навчання для покращення результатів. Такі уміння є важливими для навчання в різних предметах і контекстах та становлять основу для навчання впродовж життя.<\/p>\n<p>Цей елемент має на меті показати, що активна роль учнів в оцінюванні не виникає миттєво. Вона формується поступово - через свідоме створення можливостей, чітке окреслення очікувань і впровадження відповідних практик на рівні класу та школи. Тому надання учням можливості оцінюючи навчатися є водночас педагогічною практикою і спільною відповідальністю вчителів та учнів, що сприяє формуванню культури формувального оцінювання.<\/p>\n<hr/>\n<p>Перегляньте відео двічі: спершу без нотаток, потім - із паузами на ключових ідеях і прикладах методів формувального оцінювання<\/p>\n<a class=\"video\" href=\"https://www.youtube.com/watch?v=agrEhvBF4Zc\" rel=\"noopener\" target=\"_blank\"><img alt=\"Кадр із відео\" loading=\"lazy\" src=\"img/yt-agrEhvBF4Zc.jpg\"/><span aria-hidden=\"true\" class=\"play\"><\/span><span class=\"vcap\">▶ Дивитися відео · Відео відкриється на YouTube у новій вкладці<\/span><\/a>\n<p>Для кожного методу коротко зазначте:<\/p>\n<ul><li>Якою була його мета?<\/li><li>Які свідчення навчання він дав змогу отримати?<\/li><li>Як він сприяв залученню учнів?<\/li><li>Чи знайомий вам цей метод і чи використовували ви його раніше?<\/li><\/ul>\n<hr/>\n<p>Перейдіть за посиланням і ознайомтеся з методами каталогу <strong>FormA<\/strong>, згаданими у відео - (<a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/Rp1MfgJZSv3obLpbeGwC2y8Pf4QCwuVG\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a>) <\/p>\n<div class=\"badges\"><figure><img alt=\"Порівняльне ранжування\" loading=\"lazy\" src=\"img/m-comparative-ranking.png\"/><figcaption>Порівняльне ранжування<\/figcaption><\/figure><figure><img alt=\"Ікігай\" loading=\"lazy\" src=\"img/m-ikigai.png\"/><figcaption>Ікігай<\/figcaption><\/figure><figure><img alt=\"Взаємне спостереження\" loading=\"lazy\" src=\"img/m-peer-observation.png\"/><figcaption>Взаємне спостереження<\/figcaption><\/figure><figure><img alt=\"Правда й брехня\" loading=\"lazy\" src=\"img/m-truth-and-lie.png\"/><figcaption>Правда й брехня<\/figcaption><\/figure><figure><img alt=\"Світлофор\" loading=\"lazy\" src=\"img/m-traffic-light.png\"/><figcaption>Світлофор<\/figcaption><\/figure><\/div>\n<hr/>\n<p>Ознайомлюючись з каталогом, оберіть щонайменше два методи, які є релевантними для вашого педагогічного контексту.<\/p>\n<p>Для кожного обраного методу коротко зазначте:<\/p>\n<ul><li>Яку навчальну проблему або виклик він може допомогти вам розв’язати?<\/li><li>На якому етапі уроку ви б його використали: на початку, у середині чи наприкінці?<\/li><li>Що ви зможете зрозуміти про навчання учнів завдяки цьому методу?<\/li><li>Як учні братимуть активну участь у процесі?<\/li><li>Яка підтримка вам потрібна, щоб упевнено застосувати цей метод?<\/li><\/ul>", "p1.2": "<p>Більшість із нас розуміє, що в реальному житті доводиться вчитися постійно. Кар’єри змінюються, технології не стоять на місці, і ми часто опиняємося в ситуаціях, де немає готових правильних відповідей. У таких умовах потрібно самостійно обирати напрям, стежити за власним прогресом і змінювати підхід, якщо щось не працює. Таке життя мимоволі робить кожного з нас учнем на все життя.<\/p>\n<div class=\"box mint\">\n<p>Освіта рухається в тому ж напрямку. Учень більше не просто слухає і чекає, поки хтось скаже, що правильно, а що ні. Від нього очікують уміння робити вибір, розуміти, як саме він навчається, помічати власний прогрес і свідомо будувати свій шлях.<\/p><p>Разом із цим змінюється і роль учителя. Замість позиції «<em>Я<\/em><em> все знаю і оцінюю<\/em>» він стає помічником, який запитує: «<em>Як я можу підтримати тебе, щоб ти став упевненішим, уважнішим до себе і здатним самостійно визначати своє майбутнє?<\/em>»<\/p>\n<\/div>\n<p>У дорослому житті поруч із нами немає людини з журналом оцінок. Ніхто не виставляє бали наприкінці дня і не підкреслює червоним, що було правильно, а що варто виправити чи наскільки близько ми підійшли до мети. Здебільшого ми рухаємося вперед, спостерігаючи, що працює, змінюючи те, що не дає результату, і навчаючись через невеликі кроки, спроби, помилки та осмислення власного досвіду.<\/p>\n<div class=\"box mint\">\n<p>Формувальне оцінювання готує учнів саме до такого світу. Замість очікування остаточного вердикту вони навчаються помічати власний прогрес, осмислювати зворотний зв’язок, ставити змістовні запитання та поступово вдосконалювати своє мислення. Цей курс проведе вас через практики, які допомагають і учням, і вчителям краще розуміти процес навчання та впевнено зростати в ньому.<\/p>\n<\/div>\n<p>Формувальне оцінювання поступово утвердилося як потужний освітній підхід, що змінює уявлення про викладання й навчання. Воно переносить оцінювання з фінішної точки або підсумкового результату в площину постійного діалогу, спрямованого на розвиток. І хоча формувальних практик та ідей існувало вже чимало, вчителям бракувало простого й зрозумілого способу почати впроваджувати їх у щоденну роботу.<br/>Каталог <u><strong><a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/\" rel=\"noopener\" target=\"_blank\">FormA<\/a><\/strong>,<\/u> створений у межах ініціативи Creating New Learning (CNL) Європейського Фонду Освіти (ETF) — це новий онлайн-ресурс, покликаний підтримати освітян, викладачів, розробників навчальних програм та систем оцінювання.<\/p>\n<p class=\"formalogo\"><a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/\" rel=\"noopener\" target=\"_blank\"><img alt=\"FormA · каталог інструментів формувального оцінювання\" src=\"img/forma-logo.png\"/><\/a><\/p><p>FormA це комплексний та інтерактивний каталог інструментів для педагогів, які шукають чіткі й практичні способи впровадження формувального оцінювання у щоденну роботу на уроках. <\/p>\n<div class=\"box mint\">• FormA <strong>пояснює<\/strong>, що таке формувальне оцінювання, чому воно важливе і як відрізнити його від підсумкового, водночас показуючи, як обидва підходи можуть доповнювати одне одного.<br/>• FormA <strong>узгоджується<\/strong> із сучасними педагогічними підходами та створює навчальне середовище, у якому формувальне оцінювання підтримує успіх учнів і реалізує принцип «оцінювання як навчання». <br/>• FormA <strong>об’єднує<\/strong> актуальні тенденції у формувальному оцінюванні та пропонує практичні знання, методики й інструменти для ефективної роботи, зокрема представляє <strong>34 методи і форми діяльності для формувального оцінювання<\/strong>.<\/div><p>У FormA ви знайдете:<\/p>• Цінну інформацію – теорію, моделі та експертні думки• Практичні інструменти – шаблони, чеклісти й підказки для рефлексії• Інтерактивні навчальні матеріали – симуляції, сценарії та інструменти для самооцінювання<p class=\"ask\"><strong>Яку частину каталогу FormA вам хочеться дослідити першою?<\/strong><\/p>", "p1.4": "<p>Розуміння <strong>оцінювання<\/strong> починається з розрізнення\n<strong>підсумкового<\/strong> та <strong>формувального<\/strong>.<\/p>\n<p><strong>Підсумкове<\/strong> оцінювання проводять наприкінці курсу або\nнавчального періоду. Його основна мета полягає у вимірюванні загальних\nрезультатів навчання та рівня досягнень учнів. Такий тип оцінювання\nчасто називають <strong>оцінюванням навчання<\/strong>.<\/p>\n<p><strong>Формувальне<\/strong> оцінювання відбувається протягом усього\nнавчального процесу й спрямоване на відстеження прогресу учнів. Його\nключова мета полягає в наданні своєчасного зворотного зв’язку, який\nдопомагає вчителям побачити сильні сторони й труднощі учнів та\nвідповідно скоригувати навчання для покращення результатів. Цей підхід\nчасто називають <strong>оцінюванням для навчання<\/strong>. Формувальне\nоцінювання виступає інструментом, що допомагає визначати траєкторії\nнавчального зростання. Воно дозволяє виявляти бар’єри, які заважають\nрухатися вперед, дає уявлення про поточний рівень результатів і створює\nгнучку основу для узгодження планування викладання з індивідуальними\nосвітніми траєкторіями.<\/p>\n<p>Ці види оцінювання також різняться за <strong>часом\nпроведення<\/strong>. Підсумкове оцінювання здійснюється після завершення\nкурсу або окремого модуля, тоді як формувальне триває протягом усього\nнавчального процесу й допомагає учням поглиблювати розуміння матеріалу в\nході навчання.<\/p>\n<p>Ключова відмінність між цими підходами полягає в тому, як\nвикористовується <strong>зворотний зв’язок<\/strong>. Формувальне\nоцінювання забезпечує швидкий зворотний зв’язок як для вчителів, так і\nдля учнів. Воно зосереджене на підтримці поточного навчання та\nкоригуванні освітнього процесу з урахуванням індивідуальних потреб\nучнів. Підсумкове оцінювання не передбачає негайного зворотного зв’язку,\nнатомість дає узагальнену картину навчальних досягнень учня. Його\nрезультати зазвичай використовують для виставлення балів, підготовки\nзвітів і ухвалення рішень щодо подальшого освітнього шляху учня.<\/p>\n<h3>Як розрізнити два види оцінювання?<\/h3>\n<div class=\"tablewrap\"><table>\n<tr>\n<th><strong>Вид оцінювання<\/strong><\/th>\n<th><strong>Мета<\/strong><\/th>\n<th><strong>Час проведення<\/strong><\/th>\n<th><strong>Зворотний зв’язок<\/strong><\/th>\n<th><strong>Ким використовується<\/strong><\/th>\n<th><strong>Застосування<\/strong><\/th>\n<\/tr>\n<tr>\n<th scope=\"row\"><strong>Формувальне<\/strong><\/th>\n<td>Покращення навчання<\/td>\n<td>Під час навчання<\/td>\n<td>Негайний, адаптивний<\/td>\n<td>Учитель і учень<\/td>\n<td>Діагностика, коригування, індивідуалізація<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\"><strong>Підсумкове<\/strong><\/th>\n<td>Вимірювання результатів<\/td>\n<td>Після завершення навчання<\/td>\n<td>Відкладений, оцінювальний<\/td>\n<td>Учитель і освітня система<\/td>\n<td>Звітність, оцінювання, сертифікація<\/td>\n<\/tr>\n<\/table><\/div>\n<p>В ідеалі формувальне та підсумкове оцінювання мають доповнювати одне\nодного, забезпечуючи узгоджену підтримку навчання.<\/p>\n<h3><strong>Оцінювання ЯК\nнавчання<\/strong><\/h3>\n<p>Традиційно оцінювання розглядали насамперед як спосіб\n<strong>вимірювання результатів навчання<\/strong>. Підсумковий підхід\nбув зосереджений на оцінках, підсумках і підзвітності наприкінці\nнавчального періоду. Поява формувального оцінювання змінила цю логіку,\nзмістивши фокус на покращення навчання через постійний зворотний\nзв’язок, діалог і коригування в процесі роботи.<\/p>\n<p>Коли вчителі та учні почали використовувати оцінювання не лише для\nфіксації досягнень, а й для <strong>підтримки<\/strong> <strong>та\nспрямування<\/strong> <strong>навчального<\/strong>\n<strong>процесу<\/strong>, природним наступним кроком стало активне\nзалучення самих учнів. Так сформувалася концепція <strong>оцінювання як\nнавчання<\/strong>, у межах якої учні працюють із зворотним зв’язком,\nдоказами та рефлексією, щоб відстежувати й спрямовувати власний прогрес.\nУ цьому підході оцінювання стає інструментом усвідомленості,\nвідповідальності та особистого зростання.<\/p>\n<p>Оцінювання як навчання ставить <strong>учня в центр<\/strong>\nоцінювального процесу. Воно виходить за межі простого покращення\nрезультатів і допомагає учню навчитися вчитися. Через формувальні\nпрактики, зокрема рефлексію, самооцінювання та взаємооцінювання, учні\nпрацюють зі зворотним зв’язком і доказами, щоб самостійно визначати\nвласний прогрес і планувати наступні кроки.<\/p>\n<p>У такому підході формувальне <strong>оцінювання стає частиною самого\nнавчання<\/strong>. Це процес, який надає учням інструменти для побудови\nвласної освітньої траєкторії. Він сприяє розвитку саморегуляції,\nметакогніції та усвідомленого відстеження результатів, тобто ключових\nумінь для навчання впродовж життя та подальшого професійного\nрозвитку.<\/p>\n<div class=\"tablewrap\"><table>\n<tr>\n<th><strong>Вид оцінювання<\/strong><\/th>\n<th><strong>Навіщо воно потрібне<\/strong><\/th>\n<\/tr>\n<tr>\n<th scope=\"row\">Оцінювання навчання<\/th>\n<td>Підсумовує та засвідчує результати навчання<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Оцінювання для навчання<\/th>\n<td>Спрямовує під час освітнього процесу<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Оцінювання як навчання<\/th>\n<td>Допомагає учням рефлексувати та розвивати саморегуляцію<\/td>\n<\/tr>\n<\/table><\/div>", "p4.1": "<p>Цей інструмент самооцінювання допоможе проаналізувати, як формувальне\nоцінювання вбудовано у вашу щоденну практику. Це не оцінка. Це\nструктурований аналіз, призначений для підтримки професійного\nзростання.<\/p>\n<p>Ви можете робити нотатки, оскільки вони знадобляться вам для\nпланування наступних кроків.<\/p>\n<p>Є шість елементів практики формувального оцінювання:<\/p>\n<ul><li>Організаційна етика та культура<\/li><li>Надання учням можливості оцінюючи навчатись<\/li><li>Спільні навчальні цілі та критерії успіху<\/li><li>Різноманітні свідчення навчання<\/li><li>Ефективний зворотний зв'язок<\/li><li>Використання зворотного зв'язку для адаптації викладання<\/li><\/ul>\n<p>Для кожного елемента прочитайте опис трьох рівнів поступу:<\/p>\n<ul><li>Початок<\/li><li>Дослідження<\/li><li>Розвиток<\/li><\/ul>\n<p>Прочитайте всі три рівні, перш ніж приймати рішення. Виберіть той,\nякий найбільш точно відображає вашу типову практику, а не ваш найкращий\nурок. Якщо ви вагаєтеся між двома рівнями, виберіть нижчий. Це допоможе\nвизначити реалістичні напрямки для зростання. Не переймайтеся надто.\nВаше перше обґрунтоване враження зазвичай є точним.<\/p>\n<p>Виділіть 15–20 хвилин у тиші. Підійдіть до інструменту чесно і з\nцікавістю, а не з осудом. Подумайте про те, що ви насправді робите у\nкласі, а не про те, чого прагнете досягти. Ваша мета — зрозуміти свою\nпоточну практику, а не навішувати на себе ярлики.<\/p>\n<p>Покликання на самооцінювання: <a href=\"https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/mDaIF1ZdNpn63jLVtaydAYlRYH5d2-sC\" rel=\"noopener\" target=\"_blank\">відкрити розділ каталогу FormA ↗<\/a><\/p>\n<p>Після виконання всіх шести елементів, проаналізуйте:<\/p>\n<ul><li>Чи більшість ваших відповідей зосереджена на одному рівні?<\/li><li>Чи деякі елементи сильніші за інші?<\/li><li>Чи помічаєте ви різницю між мисленням і структурою класу?<\/li><\/ul>\n<p>Виділіть одну сферу, в якій ви відчуваєте впевненість, і одну сферу,\nв якій ви хотіли б розвиватися.<\/p>\n<p>Виберіть один елемент, який ви хотіли б посилити. Запитайте себе:<\/p>\n<ul><li>Яку невелику зміну я міг/могла би випробувати протягом наступних\nдвох тижнів?<\/li><li>Який метод або стратегія могли б підтримати цю зміну?<\/li><li>Які докази свідчили б про те, що зміна працює?<\/li><\/ul>\n<p>Зробіть свої дії свідомими. Зростання в формувальному оцінюванні\nвідбувається завдяки постійним невеликим змінам.<\/p>", "p4.2": "<p>Під час нашої заключної зустрічі ви матимете нагоду поділитися своїми\nрефлексіями щодо курсу. Щоб підготуватися, поміркуйте про наступне:<\/p>\n<p><strong>Проаналізуйте свій досвід<\/strong>: Згадайте заняття,\nонлайн-вправи, вікторини та роботу з інструментом FormA. Проаналізуйте\nключові моменти, які вплинули на ваше навчання.<\/p>\n<p><strong>Оберіть ключові ідеї<\/strong>: Визначте один або два ключових\nвисновки з курсу. Це може бути щось нове, чого ви навчилися, виклик,\nякий ви подолали, або ідея, яку ви плануєте застосувати у своїй\nроботі.<\/p>\n<p><strong>Поміркуйте над своєю навчальною діяльністю<\/strong>: Будьте\nготові поділитися коротким оглядом діяльності, яку ви розробили, як ви\nвикористовували інструмент FormA, і будь-якими відгуками, які ви\nотримали або надали.<\/p>\n<p><strong>Обміркуйте наступні кроки<\/strong>: Подумайте, як ви будете\nзастосовувати формувальне оцінювання у своєму викладанні чи тренінгу.\nЯкими будуть ваші наступні кроки? Яка підтримка вам може\nзнадобитися?<\/p>\n<p><strong>Будьте лаконічними<\/strong>: Намагайтеся вкластися в 1-2\nхвилини, коли ділитеся своїми роздумами. Зосередьтеся на найцінніших\nдумках.<\/p>\n<p>Це чудова можливість навчитися один від одного, обмінятися ідеями та\nотримати натхнення для майбутньої практики. З нетерпінням чекаємо на\nваші роздуми!<\/p>"}, "BADGE": {"tripwire": "m-tripwire.png", "peer quizzes": "m-peer-quizzes.png", "incidental scenario": "m-incidental-scenario.png", "affirmation card": "m-affirmation-card.png", "5 whys and hows": "m-5-whys-and-hows.png", "3-2-1": "m-3-2-1.png", "learning goals": "m-learning-goals.png", "success criteria": "m-success-criteria.png", "two stars and a goal": "m-two-stars-and-a-goal.png", "SMART audit": "m-smart-audit.png", "even better if": "m-even-better-if.png", "Feynman technique": "m-feynman-technique.png", "Video evidence": "m-video-evidence.png", "theory of change": "m-theory-of-change.png", "background knowledge probe": "m-background-knowledge-probe.png", "pitching progress": "m-pitching-progress.png", "exit poll": "m-exit-poll.png", "ipsative assessment": "m-ipsative-assessment.png", "spot the difference": "m-spot-the-difference.png", "scrum": "m-scrum.png", "learner-centred exhibitions": "m-learner-centred-exhibitions.png", "peer mentoring": "m-peer-mentoring.png", "structured questioning": "m-structured-questioning.png", "formative feedback loop": "m-formative-feedback-loop.png", "together we learn more": "m-together-we-learn-more.png", "feedback carousel": "m-feedback-carousel.png", "how would you?": "m-how-would-you.png", "the power of yet": "m-the-power-of-yet.png", "comparative ranking": "m-comparative-ranking.png", "ikigai": "m-ikigai.png", "peer observation": "m-peer-observation.png", "truth and lie": "m-truth-and-lie.png", "traffic light": "m-traffic-light.png"}, "UA": {"learning goals": "Навчальні цілі", "success criteria": "Критерії успіху", "two stars and a goal": "Дві зірки та мета", "SMART audit": "SMART-аудит", "even better if": "Буде ще краще, якщо…", "Feynman technique": "Метод Фейнмана", "Video evidence": "Відеосвідчення", "theory of change": "Теорія змін", "background knowledge probe": "Діагностика базових знань", "pitching progress": "Презентація поступу", "exit poll": "Вихідне опитування", "ipsative assessment": "Іпсативне оцінювання", "spot the difference": "Знайди відмінності", "scrum": "SCRUM", "learner-centred exhibitions": "Учнівські виставки", "peer mentoring": "Наставництво з боку колег", "structured questioning": "Структуроване опитування", "formative feedback loop": "Цикл зворотного зв’язку", "together we learn more": "Разом ми вчимося більше", "feedback carousel": "Карусель зворотного зв’язку", "how would you?": "А як би ви вчинили?", "the power of yet": "Сила «поки що»", "tripwire": "Перепона", "peer quizzes": "Вікторини від колег", "incidental scenario": "Сценарії для обговорення", "affirmation card": "Картки з афірмаціями", "5 whys and hows": "5 Чому й Як", "3-2-1": "3-2-1", "comparative ranking": "Порівняльне ранжування", "ikigai": "Ікігай", "peer observation": "Взаємне спостереження", "truth and lie": "Правда й брехня", "traffic light": "Світлофор"}, "VID": {"p1.3": ["E8TRa1KofzI", "yt-E8TRa1KofzI.jpg"], "p2.2": ["k0Vy4zipdL8", "yt-k0Vy4zipdL8.jpg"], "p2.3": ["5mWCHd4XshA", "yt-5mWCHd4XshA.jpg"], "p2.4": ["riBo-05NQm0", "yt-riBo-05NQm0.jpg"], "p2.5": ["FH67oQIXBrc", "yt-FH67oQIXBrc.jpg"], "p3.1": ["agrEhvBF4Zc", "yt-agrEhvBF4Zc.jpg"]}, "MODULES": [{"id": "m1", "n": 1, "title": "Оцінювання як навчання", "intro": "<p>У сучасному освітньому процесі оцінювання — це не лише про вимірювання результатів. Воно відіграє ключову роль у підтримці освітнього процесу, допомагаючи учням зрозуміти, де вони перебувають, куди прямують і що їм потрібно робити далі.<\/p><p>Цей модуль зосереджено на формувальному оцінюванні як практиці, що інформує викладання та посилює суб’єктність учнів. Ми дослідимо оцінювання для навчання та оцінювання як навчання, розглянемо, як свідчення досягнень та зворотний зв’язок спрямовують подальші кроки, і побачимо, як усі ці елементи поєднуються в каталозі FormA. У модулі підкреслюються практичні способи використання цілей, критеріїв успіху, свідчень досягнень і зворотного зв’язку для підтримки поступу й саморегуляції.<\/p><p>Під час опрацювання матеріалів ви працюватимете з конкретними прикладами, виконуватимете інтерактивні завдання і перевірятимете розуміння за допомогою коротких тестів. Кожен етап спрямований на те, щоб допомогти вам поєднати принципи формувального оцінювання з реальними освітніми практиками за допомогою FormA. Розпочнімо!<\/p>", "items": [{"id": "p1-1", "num": "1.1", "title": "Форма самооцінювання", "kind": "form", "phase": "entry", "req": true}, {"id": "p1-2", "num": "1.2", "title": "Оцінюємо заради прогресу!", "kind": "page", "src": "p1.2"}, {"id": "p1-3", "num": "1.3", "title": "Каталог інструментів формувального оцінювання", "kind": "page", "src": "p1.3", "video": true}, {"id": "p1-4", "num": "1.4", "title": "Види оцінювання", "kind": "page", "src": "p1.4"}, {"id": "p1-5", "num": "1.5", "title": "Вправи до модуля 1", "kind": "ex", "ex": "m1"}, {"id": "p1-6", "num": "1.6", "title": "Тест до модуля 1", "kind": "test", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1937", "note": "Тест · прохідний результат 70%", "req": true, "ex": "p1-6"}]}, {"id": "m2", "n": 2, "title": "Каталог інструментів формувального оцінювання FormA", "intro": "<p>У цьому модулі ми послідовно розглянемо чотири елементи циклу формувального оцінювання через захопливі відеоматеріали та глибше зануримося в їхній аналіз. За допомогою інтерактивних завдань побачимо, як практики формувального оцінювання відгукуються у власному викладанні, перевіримо своє розуміння та почнемо вибудовувати зв’язки між елементами FormA у форматі цілісного циклу.<\/p><p>Ми розглянемо, як ці практики сприяють професійному зростанню вчителя та підсилюють навчання в щоденній роботі з учнями.<\/p>", "items": [{"id": "p2-1", "num": "2.1", "title": "Цикл формувального оцінювання", "kind": "page", "src": "p2.1"}, {"id": "p2-2", "num": "2.2", "title": "Створення спільних навчальних цілей і критеріїв успіху", "kind": "page", "src": "p2.2", "video": true}, {"sub": true, "id": "p2-2x", "num": "2.2", "title": "Вправи: Створення спільних навчальних цілей і критеріїв успіху", "kind": "ex", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1940", "note": "Інтерактивні вправи", "ex": "p2-2x"}, {"id": "p2-3", "num": "2.3", "title": "Формувальне оцінювання для фіксації різноманітності навчального прогресу", "kind": "page", "src": "p2.3", "video": true}, {"sub": true, "id": "p2-3x", "num": "2.3", "title": "Вправи: Формувальне оцінювання для фіксації різноманітності навчального прогресу", "kind": "ex", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1942", "note": "Інтерактивні вправи", "ex": "p2-3x"}, {"id": "p2-4", "num": "2.4", "title": "Надання та отримання ефективного зворотного зв’язку", "kind": "page", "src": "p2.4", "video": true}, {"sub": true, "id": "p2-4x", "num": "2.4", "title": "Вправи: Надання та отримання ефективного зворотного зв’язку", "kind": "ex", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1944", "note": "Інтерактивні вправи", "ex": "p2-4x"}, {"id": "p2-5", "num": "2.5", "title": "Використання зворотного зв’язку для адаптації викладання та навчання", "kind": "page", "src": "p2.5", "video": true}, {"sub": true, "id": "p2-5x", "num": "2.5", "title": "Вправи: Використання зворотного зв’язку для адаптації викладання та навчання", "kind": "ex", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1946", "note": "Інтерактивні вправи", "ex": "p2-5x"}, {"id": "p2-6", "num": "2.6", "title": "Вправи: Опанування циклу формувального оцінювання", "kind": "ex", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1947", "note": "Інтерактивні вправи", "ex": "p2-6"}, {"id": "p2-7", "num": "2.7", "title": "Завдання: Проєктування циклу формувального оцінювання", "kind": "doctool", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1948", "note": "Інтерактивний інструмент для створення плану", "ex": "p2-7"}, {"sub": true, "id": "p2-rub", "num": "2.7-2", "title": "Рубрика самооцінювання", "kind": "rubric"}, {"id": "p2-8", "num": "2.8", "title": "Тест до модуля 2", "kind": "test", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1950", "note": "Тест · прохідний результат 70%", "req": true, "ex": "p2-8"}]}, {"id": "m3", "n": 3, "title": "Культура оцінювання у закладі освіти", "intro": "<p>У цьому модулі ми розглянемо, як учні можуть брати активну участь в оцінюванні власного поступу та навчання однокласників. За допомогою коротких відео, практичних прикладів та інтерактивних завдань ми дослідимо, що означає активна роль учнів в оцінюванні та чому вона є важливою для циклу формувального оцінювання.<\/p><p>Ви поміркуєте над тим, як залучення учнів до роботи з навчальними цілями, критеріями, свідченнями навчання та зворотним зв’язком підсилює їхню навчальну суб’єктність, саморегуляцію та здатність навчатися поза межами класу. Під час виконання завдань зверніть увагу, як ці практики можна інтегрувати в щоденне викладання та поступово підтримувати спільну культуру формувального оцінювання.<\/p>", "items": [{"id": "p3-1", "num": "3.1", "title": "Оцінюючи навчатися", "kind": "page", "src": "p3.1", "video": true}, {"id": "p3-2", "num": "3.2", "title": "Вправи до модуля 3", "kind": "ex", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1952", "note": "Інтерактивні вправи", "ex": "p3-2"}, {"id": "p3-3", "num": "3.3", "title": "Завдання: Планування залучення учнів до оцінювання", "kind": "doctool", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1953", "note": "Інтерактивний інструмент для створення плану", "ex": "p3-3"}, {"sub": true, "id": "p3-tpl", "num": "3.3-2", "title": "Шаблон взаємооцінювання", "kind": "template"}, {"id": "p3-4", "num": "3.4", "title": "Тест до модуля 3", "kind": "test", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1955", "note": "Тест · прохідний результат 70%", "req": true, "ex": "p3-4"}]}, {"id": "m4", "n": 4, "title": "Підсумки та рефлексія", "intro": "<p>У цьому останньому модулі ви проаналізуєте свій навчальний шлях і сплануєте наступні кроки у застосуванні методів формувального оцінювання. Приділіть час для аналізу ключових висновків, поділіться своїми враженнями та визначте цілі для майбутньої практики. Завершимо цей курс змістовною рефлексією та стратегією подальшого розвитку!<\/p>", "items": [{"id": "p4-1", "num": "4.1", "title": "Самооцінювання за допомогою інструменту FormA", "kind": "page", "src": "p4.1"}, {"id": "p4-2", "num": "4.2", "title": "Рефлексія вашого навчального досвіду", "kind": "page", "src": "p4.2"}, {"id": "p4-3", "num": "4.3", "title": "Фінальний тест", "kind": "test", "href": "https://uatnextgen.euacademy.fpfis.tech.ec.europa.eu/mod/h5pactivity/view.php?id=1958", "note": "Фінальний тест · прохідний результат 70%", "req": true, "ex": "p4-3"}, {"id": "p4-4", "num": "4.4", "title": "Форма самооцінювання (заключна)", "kind": "form", "phase": "exit", "req": true}, {"id": "methods", "num": "", "title": "Методи FormA у курсі", "kind": "methods"}, {"id": "cert", "num": "", "title": "Підтвердження проходження", "kind": "cert"}]}], "INTRO": [{"id": "plan", "num": "", "title": "План курсу", "kind": "task", "html": "<p>Щоб забезпечити динамічний, практичний та зручний освітній досвід, цей курс поєднує <strong>синхронні інтерактивні заняття<\/strong> та <strong>індивідуальну роботу на онлайн-платформі<\/strong>.<\/p>\n<div class=\"duo\">\n<div class=\"box mint\"><h3>Синхронні інтерактивні заняття<\/h3><p><strong>4 онлайн-зустрічі.<\/strong> Кожне заняття — це занурення в ключові поняття, корисні інсайти та жваві дискусії, що допоможуть вам застосовувати знання у реальному освітньому процесі.<\/p><\/div>\n<div class=\"box peach\"><h3>Індивідуальна робота на онлайн-платформі<\/h3><p>Між заняттями ви працюватимете на онлайн-платформі, виконуючи завдання, вправи та тести, щоб закріпити матеріал і перевести його в практичну площину.<\/p><\/div>\n<\/div>\n<h3>Як підтвердити проходження курсу?<\/h3>\n<p>Щоб успішно завершити курс, потрібно:<\/p>\n<ul class=\"checks\">\n<li><strong>Відвідати<\/strong> мінімум 3 із 4 онлайн-зустрічей (відвідування фіксує тренер).<\/li>\n<li><strong>Заповнити<\/strong> вхідну (1.1) та заключну (4.4) форми самооцінювання.<\/li>\n<li><strong>Виконати<\/strong> тести до модулів 1–3 і фінальний тест із результатом 70% і вище.<\/li>\n<li><strong>Заповнити<\/strong> форму відгуку про курс.<\/li>\n<\/ul>\n<p>Після цього на сторінці <a href=\"#cert\">«Підтвердження проходження»<\/a> ви отримаєте персональний код, який потрібно надіслати своєму тренеру.<\/p>\n"}, {"id": "materials", "num": "", "title": "Матеріали для тренерів", "kind": "task", "html": "<div class=\"sessions\">\n<a class=\"session folder\" href=\"https://drive.google.com/drive/folders/1zDhHlvcI9CurRZGy_6cm8Pmn2pjBrX2U?usp=drive_link\" target=\"_blank\" rel=\"noopener\"><b>Папка<\/b><span>Презентації та плани занять ↗<\/span><\/a>\n<\/div>", "tool": "verify"}], "ELEMENTS": [{"n": "Модуль 1", "title": "Методи з відео «Оцінюємо заради прогресу»", "q": "Метод у класі пані Коваль", "page": "p1-3", "link": "https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/82EMlY1zCju5w7c4TUC4KtCusJASuxIk", "m": ["tripwire", "peer quizzes", "incidental scenario", "affirmation card", "5 whys and hows", "3-2-1"]}, {"n": "Елемент 2", "title": "Надання учням можливості оцінюючи навчатися", "q": "Учні як повноцінні учасники оцінювання", "page": "p3-1", "link": "https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/Rp1MfgJZSv3obLpbeGwC2y8Pf4QCwuVG", "m": ["comparative ranking", "ikigai", "peer observation", "truth and lie", "traffic light"]}, {"n": "Елемент 3", "title": "Спільні навчальні цілі та критерії успіху", "q": "Навіщо ми це вивчаємо і як виглядає успіх?", "page": "p2-2", "link": "https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/4Z8NjyPp80DhHKzj-iLGYWpGk5Hxqrkb", "m": ["learning goals", "success criteria", "two stars and a goal", "SMART audit", "even better if"]}, {"n": "Елемент 4", "title": "Різноманітні свідчення навчального прогресу", "q": "Які свідчення навчання ми маємо на цей момент?", "page": "p2-3", "link": "https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/O08hU3WySHWqE_eUkKZyGgO6Q_AoDZXw", "m": ["Feynman technique", "Video evidence", "theory of change", "background knowledge probe", "pitching progress", "exit poll", "ipsative assessment"]}, {"n": "Елемент 5", "title": "Надання та отримання ефективного зворотного зв’язку", "q": "Що нам говорять свідчення і як вони можуть допомогти нам покращитися?", "page": "p2-4", "link": "https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/jubGEOCZ_9-j33DhHWY9CVommpkEUJ6W", "m": ["spot the difference", "scrum", "learner-centred exhibitions", "peer mentoring", "structured questioning"]}, {"n": "Елемент 6", "title": "Використання зворотного зв’язку для адаптації", "q": "Що ми змінюємо далі і як рухаємося вперед?", "page": "p2-5", "link": "https://share.articulate.com/dmhZmI8rCabv7dROc-IdK#/lessons/y_rn9aRsiy8W8X1ciA5OvkxYP6c6H2Nv", "m": ["formative feedback loop", "together we learn more", "feedback carousel", "how would you?", "the power of yet"]}], "RUBRIC": {"levels": ["Відмінно", "Потребує вдосконалення", "Незадовільно"], "rows": [["Контекст навчання", "Контекст навчання чітко і точно визначений. Предмет, учні та мета циклу формувального оцінювання чітко сформульовані.", "Описано базовий контекст, але деякі елементи не є достатньо чіткими або не мають відношення до циклу.", "Контекст є нечітким, відсутнім або не має відношення до циклу формувального оцінювання."], ["Цілі навчання та критерії успішності", "Цілі навчання та критерії успішності є чіткими, зручними для учнів та добре узгодженими. Залученість учнів є очевидною.", "Цілі та критерії визначені, але їм бракує чіткості, орієнтованості на учнів або повної узгодженості.", "Цілі та критерії успішності відсутні, нечіткі або невідповідні."], ["Свідчення навчання", "Чітко визначені та узгоджені з навчальними цілями різноманітні, відповідні форми свідчень, які збираються під час навчання.", "Свідчення визначені, але обмежені за різноманітністю або термінами. Узгодженість з цілями є частковою.", "Свідчення навчання відсутні або є невідповідними."], ["Дизайн зворотного зв’язку", "Зворотний зв’язок є своєчасним, конкретним і чітко пов’язаним з навчальними цілями та критеріями успішності. Учні беруть активну участь у процесах зворотного зв’язку.", "Зворотний зв’язок є запланованим, але йому бракує конкретності, своєчасності або залучення учнів.", "Зворотний зв’язок не заплановано або не має відношення до навчальних цілей."], ["Адаптація викладання та навчання", "Зворотний зв’язок чітко використовується для внесення значущих змін у викладання та навчання. Наступні кроки чітко визначені.", "Зміни згадуються, але вони є нечіткими, обмеженими або слабо пов’язаними із зворотним зв’язком.", "Зміни не плануються або зворотний зв’язок не використовується."], ["Цілісність циклу", "Всі етапи циклу формувального оцінювання добре пов’язані між собою і функціонують як цілісний процес.", "Етапи присутні, але зв’язки між ними не завжди чіткі.", "Етапи роз’єднані або цикл неповний."], ["Суб’єктність учнів", "Цей цикл активно підтримує відповідальність учнів, рефлексію та саморегуляцію.", "Деякі можливості для суб’єктності учнів присутні, але не повністю розвинені.", "Учні пасивні; немає акценту на суб’єктності чи саморегуляції."]]}, "FEEDBACK_STEPS": [["Укажіть, що Ви побачили", ["Опишіть основну ідею або підхід", "Не оцінюйте - просто зафіксуйте зміст", "Це допоможе колезі зрозуміти, як його/її роботу сприйняли"]], ["Відзначте сильні сторони роботи", ["Назвіть 1-2 конкретні речі, які вдалися", "Пишіть про конкретні елементи (мета, завдання, структура тощо)"]], ["Зверніть увагу на те, що можна покращити", ["Оберіть 1-2 моменти", "Пишіть про конкретну частину роботи", "Уникайте різких формулювань"]], ["Дайте просту рекомендацію, як покращити", ["Запропонуйте конкретну дію", "Порада має бути реальною", "Пов’яжіть із попереднім пунктом"]]], "EX": {"m1": [{"intro": "<h3>1. Формувальне чи підсумкове? У чому різниця?<\/h3><p>Перетягніть кожен опис у відповідну категорію, щоб визначити, чи він більше відповідає <strong>формувальному<\/strong> або <strong>підсумковому<\/strong> оцінюванню.<\/p>", "items": [{"type": "drag", "title": "", "mode": "categorize", "zones": [{"id": "0", "label": "Формувальне оцінювання", "correct": ["0", "1", "2", "3", "4"]}, {"id": "1", "label": "Підсумкове оцінювання", "correct": ["5", "6", "7", "8", "9"]}], "cards": [{"id": "0", "text": "Допомагає учням і вчителям визначити подальші кроки."}, {"id": "1", "text": "Відбувається під час навчання, а не після його завершення."}, {"id": "2", "text": "Забезпечує швидкий зворотний зв’язок."}, {"id": "3", "text": "Часто має неформальний характер і є частиною роботи на уроці."}, {"id": "4", "text": "Зосереджене на прогресі та покращенні, а не на оцінках."}, {"id": "5", "text": "Проводиться після завершення навчання."}, {"id": "6", "text": "Дає оцінку, бал або сертифікат."}, {"id": "7", "text": "Використовується для звітування про здобутки."}, {"id": "8", "text": "Зазвичай є формальним, запланованим і стандартизованим."}, {"id": "9", "text": "Зворотний зв’язок надходить занадто пізно, щоб вплинути на поточне навчання."}], "fbFail": "Майже готово! Шукайте підказки про те, коли проводиться оцінка і для чого вона використовується.", "fbFull": "Молодець! Ви правильно визначили, що формувальне оцінювання підтримує й розвиває
