<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormA: формувальне оцінювання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette taken from the FormA method badges: navy ink, badge sky-blue, Moodle box tints */
  --ink:#1c2740; --muted:#55607a; --paper:#f4f7f7; --surface:#ffffff; --line:#d9e2e4;
  --accent:#23798c; --accent-ink:#ffffff; --sky:#8fd0de; --sun:#f2c14e; --coral:#e2574c;
  --mint:#d1e6e2; --rose:#ecd0dc; --peach:#fde6d3; --done:#2f8a5b;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* layout: course index left, one reading column right; index becomes a drawer on phones */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ecf2; --muted:#a3afc2; --paper:#121823; --surface:#1a2230; --line:#2b3546;
  --accent:#6cc3d4; --accent-ink:#0f1520; --sky:#3f8796; --sun:#e2b34a; --coral:#ef7a70;
  --mint:#1f3633; --rose:#3a2733; --peach:#3b2c20; --done:#5cc48c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#e6ecf2; --muted:#a3afc2; --paper:#121823; --surface:#1a2230; --line:#2b3546;
  --accent:#6cc3d4; --accent-ink:#0f1520; --sky:#3f8796; --sun:#e2b34a; --coral:#ef7a70;
  --mint:#1f3633; --rose:#3a2733; --peach:#3b2c20; --done:#5cc48c; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:4px}
img{max-width:100%;height:auto}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brandmark{font:700 15px/1 var(--display);background:var(--ink);color:var(--surface);padding:7px 9px;border-radius:8px;letter-spacing:.02em}
.brand span{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.prog .bar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.menu{display:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:600 14px var(--body);cursor:pointer}

.wrap{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100% - 56px)}
nav.index{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.index a{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.35;padding:7px 10px;border-radius:8px}
.index a:hover{background:var(--paper)}
.index a[aria-current="page"]{background:var(--mint);font-weight:600}
.index .num{flex:0 0 auto;min-width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
.index .tick{margin-left:auto;flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid var(--line)}
.index .tick.on{background:var(--done);border-color:var(--done);position:relative}
.index .tick.on::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.index details{margin:6px 0}
.index summary{list-style:none;cursor:pointer;padding:10px 10px 8px;border-radius:8px;display:flex;flex-direction:column;gap:6px}
.index summary::-webkit-details-marker{display:none}
.index summary b{font:600 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.index summary span{font-weight:600;font-size:15px;line-height:1.3}
.index summary .mbar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.index summary .mbar i{display:block;height:100%;background:var(--done)}
.index .kind{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px;white-space:nowrap}

main{padding:36px 24px 80px;min-width:0}
.col{max-width:760px;margin:0 auto}
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted)}
h1{font:700 clamp(24px,3.4vw,34px)/1.2 var(--display);margin:0 0 18px;text-wrap:balance;letter-spacing:-.01em}
h2{font:700 22px/1.25 var(--display);margin:40px 0 14px;text-wrap:balance}
h3{font-size:19px;line-height:1.3;margin:28px 0 10px;text-wrap:balance}
h3 small{display:block;font-weight:400;font-style:italic;color:var(--muted);font-size:16px;margin-top:4px}
p{margin:0 0 14px}
.content{max-width:68ch}
.content ul{padding-left:22px;margin:0 0 14px}
.content li{margin:4px 0}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.meta{font-size:14px;color:var(--muted)}

.box{border-radius:12px;padding:18px 20px;margin:0 0 20px;border:2px solid var(--mint);background:var(--surface)}
.box.rose{border-color:var(--rose)} .box.peach{border-color:var(--peach)}
.box.fill{background:var(--mint);border-color:var(--mint)}
.box > :last-child{margin-bottom:0}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:8px}
.duo .box{margin:0} .duo h3{margin-top:0}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;margin:18px 0 22px;max-width:760px}
.badges figure{margin:0;text-align:center}
.badges img{width:100%;max-width:150px;aspect-ratio:500/420;object-fit:contain;display:block;margin:0 auto}
.badges figcaption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.video{position:relative;display:block;max-width:640px;margin:14px auto 18px;border-radius:12px;overflow:hidden;text-decoration:none;background:#000;aspect-ratio:16/9}
.video{border:0;width:100%}
.video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88;transition:opacity .2s}
.video:hover img{opacity:1}
.video .play{position:absolute;left:50%;top:45%;width:74px;height:52px;transform:translate(-50%,-50%);background:var(--coral);border-radius:14px}
.video .play::after{content:"";position:absolute;left:29px;top:15px;border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff}
.video .vcap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:14px;font-weight:500}

.tablewrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:first-child th{background:var(--mint)}
tr:last-child th,tr:last-child td{border-bottom:0}

.lbtn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:15px;border:0;cursor:pointer;font-family:var(--body)}
.lbtn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.lbtn:hover{filter:brightness(1.08)}
.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.formalogo{margin:22px 0}
.formalogo a{display:block;max-width:420px;margin:0 auto;background:#fff;border-radius:14px;padding:14px 18px;border:1px solid var(--line)}
.formalogo img{display:block;width:100%}
.formalink a{display:inline-block;font:700 18px/1.3 var(--display);padding:16px 22px;border-radius:14px;background:var(--ink);color:var(--surface);text-decoration:none}
.ask{font-size:18px;margin-top:20px}

ul.checks{list-style:none;padding:0}
ul.checks li{position:relative;padding-left:30px;margin:8px 0}
ul.checks li::before{content:"";position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:5px;border:2px solid var(--accent)}

ol.steps{list-style:none;padding:0;margin:20px 0;display:grid;gap:14px}
ol.steps li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sky);border-radius:12px;padding:16px 18px}
ol.steps .sicon{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
ol.steps li > div > :last-child{margin-bottom:0}
@media (max-width:480px){ol.steps li{grid-template-columns:48px minmax(0,1fr)} ol.steps .sicon{width:48px;height:48px}}
ol.steps .sn{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hint{font-size:15px;color:var(--muted)}

.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.session{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.session b{font:700 16px var(--display)} .session span{color:var(--muted);font-size:14px}
.session.folder{background:var(--mint);border-color:var(--mint)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:center;margin-bottom:10px}
.hero .lede{font-size:18px;color:var(--muted);max-width:60ch}
.cycle{width:100%;max-width:220px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fact b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.fact span{font-size:14px;color:var(--muted)}
.mods{display:grid;gap:12px;margin:14px 0 28px}
.mod{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.mod:hover{border-color:var(--accent)}
.mod .n{font:700 28px/1 var(--display);color:var(--accent);text-align:center}
.mod h3{margin:0 0 4px;font-size:17px}
.mod p{margin:0;font-size:14px;color:var(--muted)}
.mod .pc{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* module intro list */
.items{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.items a{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.items a:hover{border-color:var(--accent)}
.items .num{min-width:44px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.req{font-size:12px;font-weight:600;color:var(--coral);white-space:nowrap}

/* h5p placeholder */
.h5p{border:2px dashed var(--sky);border-radius:14px;padding:22px;background:var(--surface)}
.h5p .tag{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--sky);color:var(--ink);padding:6px 9px;border-radius:6px;margin-bottom:12px}

/* self-assessment */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 12px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;line-height:1.4}
.q fieldset{border:0;padding:0;margin:0;min-width:0}
.scale{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;width:44px;height:44px;margin:0;cursor:pointer}
.scale label span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper)}
.scale input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.legend{display:flex;justify-content:space-between;gap:12px;width:100%;max-width:252px;margin-top:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.saved{font-size:14px;color:var(--done);font-weight:600;min-height:1.4em}
.compare{display:grid;gap:12px;margin:14px 0}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.crow .qn{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:3px}
.bars div{display:grid;grid-template-columns:62px minmax(0,1fr) 22px;gap:8px;align-items:center}
.bars i{display:block;height:12px;border-radius:6px;background:var(--line)}
.bars i b{display:block;height:100%;border-radius:6px}
.bars .e b{background:var(--sky)} .bars .x b{background:var(--accent)}
.bars em{font-style:normal;color:var(--muted);font-size:12.5px}
.bars strong{font-variant-numeric:tabular-nums;text-align:right}

/* methods page */
.el{margin:0 0 30px}
.el header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.el .en{font:700 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.el h2{margin:6px 0 2px;font-size:19px}
.el .q2{font-style:italic;color:var(--muted);margin:0 0 4px}
.el .badges{margin:10px 0 6px}

/* rubric + feedback template */
.tool{margin-top:34px;scroll-margin-top:70px}
.tool.page{margin-top:0}
.index a.sub{padding-left:26px}
.index a.sub .num{min-width:38px;opacity:.7}
.items li.sub{margin-left:32px}
.items li.sub a{background:var(--paper);border-style:dashed}
.tool h2{margin-top:0}
.howto{background:var(--mint);border-radius:12px;padding:14px 18px;margin:0 0 16px;font-size:15px}
.howto ol{margin:0;padding-left:20px}
.rubric{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:640px}
.rubric th,.rubric td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.rubric tr:first-child th{background:var(--mint);padding:10px 12px}
.rubric th[scope=row]{padding:10px 12px;width:18%;background:var(--surface)}
.rubric td button{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;padding:10px 12px;cursor:pointer;line-height:1.4}
.rubric td button:hover{background:var(--paper)}
.rubric td button[aria-checked="true"]{background:var(--sky);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.rubric td button:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.copybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.copyout{width:100%;min-height:90px;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:14px/1.5 var(--body)}
.fsteps{display:grid;gap:12px;counter-reset:fs}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fstep h3{margin:0 0 6px;font-size:17px}
.fstep h3 span{color:var(--accent);margin-right:6px}
.fstep ul{margin:0 0 10px;padding-left:20px;font-size:15px;color:var(--muted)}
.fstep label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fstep textarea{width:100%;min-height:64px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);resize:vertical}

/* exercises (ported from the Module 1 HTML) */
.exw section.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 22px;margin:0 0 22px}
.exw .intro h3{margin:0 0 10px;font-size:19px}
.exw .intro p{margin:6px 0}
.exw h4.subtitle{margin:22px 0 8px;font-size:16px}
.exw button{font:600 15px var(--body);cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px}
.exw button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exw button:disabled{opacity:.45;cursor:default}
.exw .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.exw .zones{display:grid;gap:12px;margin-top:14px}
.exw .zones.categorize{grid-template-columns:1fr 1fr}
.exw .zone{border:2px dashed var(--line);border-radius:10px;background:var(--paper);padding:10px;min-height:70px}
.exw .zone .zlabel{font-weight:700;font-size:14px;color:var(--accent);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.exw .zone .zlabel .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}
.exw .zones.sequence .zone{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:10px;min-height:58px}
.exw .zones.sequence .zone .zlabel{margin:0}
.exw .ztw{border:0;background:transparent;margin-top:14px}
.exw .zones.table{gap:8px;min-width:640px;margin-top:0}
.exw .zones.table .th,.exw .zones.table .rh{font-weight:700;font-size:14px;padding:8px 10px;background:var(--mint);border-radius:8px;display:flex;align-items:center}
.exw .zones.table .zone{min-height:84px;padding:8px}
.exw .zone .slot{display:flex;flex-direction:column;gap:8px;min-height:36px}
.exw .zone.hot{border-color:var(--accent);background:var(--mint)}
.exw .zone.target{border-style:solid;border-color:var(--sky)}
.exw .pool{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper)}
.exw .pool .ptitle{font-size:13px;color:var(--muted);margin-bottom:6px}
.exw .pool .slot{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.exw .dcard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.4;box-shadow:0 1px 2px rgba(20,30,50,.08);cursor:grab;user-select:none;touch-action:none;position:relative}
.exw .dcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--sky)}
.exw .dcard.ghost{opacity:.35}
.dcard.flying{position:fixed;z-index:1000;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font:15px/1.4 var(--body);box-shadow:0 8px 24px rgba(20,30,50,.25);transform:rotate(1.5deg)}
.exw .dcard.ok{border-color:var(--done);background:color-mix(in srgb,var(--done) 14%,var(--surface))}
.exw .dcard.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--surface))}
.exw .dcard.ok::after,.exw .dcard.bad::after{position:absolute;right:8px;top:6px;font-weight:700}
.exw .dcard.ok::after{content:"✓";color:var(--done)} .exw .dcard.bad::after{content:"✗";color:var(--coral)}
.exw .dcard.ok,.exw .dcard.bad{padding-right:26px;cursor:default}
.exw .score{flex:1 1 240px;display:flex;align-items:center;gap:10px}
.exw .sbar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.exw .sbar>i{display:block;height:100%;background:var(--done);width:0;transition:width .4s}
.exw .score b{white-space:nowrap;font-variant-numeric:tabular-nums}
.exw .feedback{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--mint)}
.exw .explain{font-size:13px;color:var(--muted);margin-top:6px}
.exw .dots{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.exw .dots button{width:30px;height:30px;padding:0;border-radius:50%;font-size:13px}
.exw .dots button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--sky)}
.exw .dots button.ok{background:color-mix(in srgb,var(--done) 18%,var(--surface));border-color:var(--done);color:var(--done)}
.exw .dots button.bad{background:color-mix(in srgb,var(--coral) 18%,var(--surface));border-color:var(--coral);color:var(--coral)}

/* ---------- access: the course and trainers' materials are encrypted; access/*.txt list who may open them ---------- */
const A_SALT = 'FormA-access-v1', A_ITER = 150000, te = new TextEncoder();
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const lsGet = (k, d) => { try { const v = localStorage.getItem('forma-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem('forma-' + k) : localStorage.setItem('forma-' + k, JSON.stringify(v)); } catch (e) {} };
async function aDerive(email){
  const base = await crypto.subtle.importKey('raw', te.encode(String(email).trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:te.encode(A_SALT), iterations:A_ITER}, base, 384));
  return {id: b64u(bits.slice(0, 16)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''), wk: bits.slice(16)};
}
async function aOpen(keyBytes, b){ const raw = ub64(b); const k = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0, 12)}, k, raw.slice(12))); }
async function aSeal(keyBytes, data){ const iv = crypto.getRandomValues(new Uint8Array(12)); const k = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, data)); const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64u(out); }
async function aLine(email, kc, kt){ const {id, wk} = await aDerive(email); return [id, await aSeal(wk, kc)].concat(kt ? [await aSeal(wk, kt)] : []).join(';'); }
async function aLookup(email){
  const {id, wk} = await aDerive(email); let reached = false;
  for (const file of ['access/trainers.txt', 'access/learners.txt']) {
    let txt = '';
    try { const r = await fetch(file, {cache:'no-store'}); if (r.ok) { txt = await r.text(); reached = true; } } catch (e) {}
    for (const ln of txt.split(/\r?\n/)) { const t = ln.trim(); if (!t || t[0] === '#') continue;
      const p = t.split(';'); if (p[0] !== id) continue;
      try { return {kc: await aOpen(wk, p[1]), kt: p[2] ? await aOpen(wk, p[2]) : null}; } catch (e) {} }
  }
  return reached ? null : undefined;   // null: not on the lists; undefined: lists unreachable
}
async function aUnlock(email, k){
  const DATA = JSON.parse(new TextDecoder().decode(await aOpen(k.kc, ENC)));
  const TRAINER = k.kt ? JSON.parse(new TextDecoder().decode(await aOpen(k.kt, TENC))) : null;
  document.body.classList.remove('locked');
  const aid = (await aDerive(email)).id;
  APP(DATA, TRAINER, {email: String(email).trim().toLowerCase(), kc: k.kc, kt: k.kt, owner: aid === OWNER, uid: aid.slice(0, 10)});
}
const gmsg = t => { document.getElementById('gmsg').textContent = t; };
async function boot(){
  if (!(window.crypto && crypto.subtle)) { gmsg('Цей браузер не підтримує захищений вхід. Спробуйте інший браузер (Chrome, Edge, Firefox, Safari).'); return; }
  const saved = lsGet('user', null);
  if (saved) {
    gmsg('Відкриваю курс…');
    const k = await aLookup(saved.email);
    if (k) { lsSet('user', {email:saved.email, kc:b64u(k.kc), kt:k.kt ? b64u(k.kt) : null}); return aUnlock(saved.email, k); }
    if (k === undefined && saved.kc) return aUnlock(saved.email, {kc:ub64(saved.kc), kt:saved.kt ? ub64(saved.kt) : null});
    lsSet('user', null); gmsg('Доступ для цієї адреси закрито. Зверніться до свого тренера.');
  }
}
document.getElementById('gateform').addEventListener('submit', async e => {
  e.preventDefault();
  const em = document.getElementById('gemail').value.trim(), btn = document.getElementById('gbtn');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { gmsg('Перевірте електронну адресу.'); return; }
  btn.disabled = true; gmsg('Перевіряю…');
  const k = await aLookup(em); btn.disabled = false;
  if (k === undefined) { gmsg('Не вдалося перевірити адресу. Перевірте з’єднання з інтернетом і спробуйте ще раз.'); return; }
  if (!k) { gmsg('Цієї адреси немає у списку учасників курсу. Перевірте написання або зверніться до свого тренера.'); return; }
  lsSet('user', {email:em.toLowerCase(), kc:b64u(k.kc), kt:k.kt ? b64u(k.kt) : null});
  gmsg(''); aUnlock(em, k);
});

function APP(DATA, TRAINER, USER){
if (TRAINER) { const m = DATA.INTRO.find(i => i.id === 'materials'); if (m) m.html = TRAINER.materials; }
else DATA.INTRO = DATA.INTRO.filter(i => i.id !== 'materials');
document.getElementById('whoemail').textContent = USER.email;
document.getElementById('logout').onclick = () => { lsSet('user', null); location.hash = ''; location.reload(); };
const {P, BADGE, UA, VID, MODULES, INTRO, ELEMENTS, QUESTIONS, WELCOME, RUBRIC, FEEDBACK_STEPS, EX, REQ, FEEDBACK_URL} = DATA;

/* ---------- storage (this browser only) ---------- */
const NS = 'forma-' + USER.uid + '-';   // each participant's progress is kept apart, even on a shared device
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get('done', {});
/* On claude.ai the page cannot embed other sites; on GitHub Pages or any normal host it can */
const CAN_EMBED = location.protocol.startsWith('http') && !/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname);

/* ---------- flat order ---------- */
const ORDER = [{id:'home', title:'Ласкаво просимо', num:'', kind:'home'}];
INTRO.forEach(i => ORDER.push({...i, mod:null}));
MODULES.forEach(m => { ORDER.push({id:m.id, title:'Модуль '+m.n+'. '+m.title, kind:'module', mod:m}); m.items.forEach(i => ORDER.push({...i, mod:m})); });
const BYID = Object.fromEntries(ORDER.map(o => [o.id, o]));
const COUNTABLE = ORDER.filter(o => !['home','module','methods','cert'].includes(o.kind) && !['plan','materials'].includes(o.id));
const KINDLABEL = {doctool:'Завдання', h5p:'H5P', form:'Форма', task:'Завдання', ex:'Вправи', test:'Тест'};
const REQIDS = new Set(REQ.map(r => r.id));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- index ---------- */
function modPct(m){ const its = m.items.filter(i => COUNTABLE.some(c => c.id === i.id)); return [its.filter(i => done[i.id]).length, its.length]; }
function link(o, cur){

  const tick = COUNTABLE.includes(o) ? `<span class="tick ${done[o.id]?'on':''}" aria-label="${done[o.id]?'виконано':''}"></span>` : '';
  return `<a href="#${o.id}" class="${o.sub?'sub':''}" ${cur===o.id?'aria-current="page"':''}><span class="num">${o.num||''}</span><span>${esc(o.title)}</span>${tick}</a>`;
}
function renderIndex(cur){
  const curMod = BYID[cur] && BYID[cur].mod;
  let h = link(ORDER[0], cur) + INTRO.map(i => link(i, cur)).join('');
  MODULES.forEach(m => {
    const [d, n] = modPct(m);
    const open = curMod===m || cur===m.id;
    h += `<details ${open?'open':''}><summary><b>Модуль ${m.n}</b><span>${esc(m.title)}</span><span class="mbar"><i style="width:${Math.round(d/n*100)}%"></i></span></summary>`
       + link({id:m.id, num:'', title:'Огляд модуля', kind:'module'}, cur) + m.items.map(i => link(i, cur)).join('') + '</details>';
  });
  document.getElementById('index').innerHTML = h;
  const d = COUNTABLE.filter(o => done[o.id]).length;
  document.getElementById('progtxt').textContent = `${d} / ${COUNTABLE.length}`;
  document.getElementById('progbar').style.width = (d/COUNTABLE.length*100) + '%';
}

/* ---------- views ---------- */
function badges(alts, caps){
  return `<div class="badges">${alts.map(a => `<figure><img src="img/${BADGE[a]}" alt="${esc(UA[a])}" loading="lazy"><figcaption>${esc(UA[a])}</figcaption></figure>`).join('')}</div>`;
}
function cycleSVG(){
  const segs = [['3','#8fd0de'],['4','#f2c14e'],['5','#e2574c'],['6','#7cc39a']];
  let s = '<svg class="cycle" viewBox="0 0 200 200" role="img" aria-label="Цикл формувального оцінювання FormA"><g fill="none" stroke-width="26">';

const TXT = {

  scoreExplain:'Правильні відповіді додають 1 бал. Неправильні відповіді віднімають 1 бал. Найменша можлива оцінка — 0.',

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v===false||v==null) continue;
    if (k==='class') n.className=v; else if (k==='html') n.innerHTML=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c => c!=null && n.append(c));
  return n;
};
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function DragTask(item){
  const root = el('div',{class:'dnd'});

    const lab = table ? null : el('div',{class:'zlabel'}, seq?el('span',{class:'num'},String(i+1)):null, z.label);

  });
  const poolSlot = el('div',{class:'slot'});
  const pool = el('div',{class:'pool',tabindex:'0'}, el('div',{class:'ptitle'},TXT.pool), poolSlot);
  pool._idx=null; pool._slot=poolSlot;
  pool.addEventListener('click',e=>{ if(e.target.closest('.dcard')) return; dropSelected(null); });
  pool.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===pool){e.preventDefault();dropSelected(null);} });
  const out = el('div');
  const checkBtn = el('button',{class:'primary',type:'button',onclick:check},TXT.check);
  const retryBtn = el('button',{type:'button',onclick:reset},TXT.retry);
  const actions = el('div',{class:'actions'}, checkBtn, retryBtn);
  root.append(table?el('div',{class:'tablewrap ztw'},zonesWrap):zonesWrap, pool, actions, out);
  const cardEls = {};

    const ce = el('div',{class:'dcard',tabindex:'0',role:'button'}, c.text);
    ce._id=c.id; cardEls[c.id]=ce;

    attachPointer(ce);
  });
  function draw(){
    zoneEls.forEach(z=>z._slot.innerHTML=''); poolSlot.innerHTML='';
    order.forEach(id=>{ const z=place[id]; (z==null?poolSlot:zoneEls[z]._slot).append(cardEls[id]); cardEls[id].classList.toggle('sel',selected===id); });
    pool.style.display = (!checked || order.some(id=>place[id]==null)) ? '' : 'none';
    zoneEls.forEach(z=>z.classList.toggle('target',selected!=null));
    checkBtn.disabled = checked;
  }
  function toggleSel(id){ if(checked) return; selected = selected===id?null:id; draw(); }
  function moveTo(id,zi){
    if(checked) return;
    if(single && zi!=null){ const occ = order.find(x=>place[x]===zi && x!==id); if(occ) place[occ]=place[id] ?? null; }
    place[id]=zi; selected=null; draw();
  }
  function dropSelected(zi){ if(selected!=null) moveTo(selected,zi); }
  function attachPointer(ce){
    let sx,sy,dragging=false,fly=null,offX=0,offY=0,hot=null;
    ce.addEventListener('pointerdown',e=>{ if(checked || e.button>0) return; sx=e.clientX; sy=e.clientY; dragging=false; ce.setPointerCapture(e.pointerId); });

        const t=targetAt(e.clientX,e.clientY);
        if(hot!==t){ hot&&hot.classList.remove('hot'); hot=t; hot&&hot.classList.add('hot'); }
      }
    });
    const end=e=>{
      if(sx==null) return;
      if(dragging){ fly.remove(); ce.classList.remove('ghost'); hot&&hot.classList.remove('hot'); const t=targetAt(e.clientX,e.clientY); if(t) moveTo(ce._id,t._idx); }

    order=shuffle(item.cards.map(c=>c.id)); order.forEach(id=>{place[id]=null; cardEls[id].classList.remove('ok','bad');}); draw();
  }

}
function QuizTask(item){

      class:[i===cur?'cur':'', ans[i]!=null?(isOk(i)?'ok':'bad'):''].join(' '), 'aria-label':`Питання ${i+1}`, onclick:()=>{cur=i;draw();}}, String(i+1))));

/* ---------- completion code ----------

   It is checked on the trainers' page (#verify). The key lives in this page,
   so it guards against mistakes and casual edits, not against someone who reads the source. */
const K = ['Fm','A-ua','-26','::sx','7Qp','v4m'].join('');

  const enc = new TextEncoder();

  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(normEmail(email) + '|FormA|' + d)));

  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode([normEmail(email), normName(name), d, code, 'cert'].join('|'))));

function wireAccess(){
  const msg = document.getElementById('amsg');
  document.getElementById('ago').onclick = async () => {
    const role = document.querySelector('input[name="arole"]:checked').value;
    const list = [...new Set(document.getElementById('ain').value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean))];
    const bad = list.filter(e => !validEmail(e)), good = list.filter(e => validEmail(e));
    if (!good.length) { msg.textContent = 'Вставте хоча б одну коректну адресу.'; return; }
    msg.textContent = 'Створюю рядки…';
    const lines = []; for (const e of good) lines.push(await aLine(e, USER.kc, role === 'trainer' ? USER.kt : null));
    document.getElementById('alines').value = lines.join('\n');
    const repo = location.hostname.endsWith('.github.io') ? `https://github.com/${location.hostname.split('.')[0]}/${location.pathname.split('/').filter(Boolean)[0] || ''}` : null;
    const ed = document.getElementById('aedit');
    if (repo) { ed.href = `${repo}/edit/main/access/${role === 'trainer' ? 'trainers' : 'learners'}.txt`; ed.hidden = false; } else ed.hidden = true;
    const tok = GH.repo && lsGet('ghtoken', null);
    document.getElementById('aauto').hidden = !tok; document.getElementById('amanual').hidden = !!tok;
    document.getElementById('aauto').dataset.file = `access/${role === 'trainer' ? 'trainers' : 'learners'}.txt`;
    document.getElementById('aout').hidden = false;
    msg.textContent = `Створено рядків: ${good.length}.` + (bad.length ? ` Пропущено некоректні адреси: ${bad.join(', ')}.` : '');
  };
  const gm = document.getElementById('ghmsg'), box = document.getElementById('ghbox');
  if (!GH.repo) box.hidden = true;
  const showTok = () => { gm.textContent = lsGet('ghtoken', null) ? 'Токен збережено в цьому браузері.' : 'Токен не збережено.'; };
  showTok();
  document.getElementById('ghsave').onclick = async () => { const t = document.getElementById('ghtok').value.trim();
    if (!t) { gm.textContent = 'Вставте токен.'; return; }
    gm.textContent = 'Перевіряю токен…';
    const r = await ghReq('GET', 'access/learners.txt', null, t);
    if (!r.ok) { gm.textContent = ghErr(r.status); return; }
    lsSet('ghtoken', t); document.getElementById('ghtok').value = ''; gm.textContent = 'Токен працює і збережений у цьому браузері.'; };
  document.getElementById('ghforget').onclick = () => { lsSet('ghtoken', null); showTok(); document.getElementById('aauto').hidden = true; document.getElementById('amanual').hidden = false; };
  document.getElementById('aauto').onclick = async () => {
    const btn = document.getElementById('aauto'), file = btn.dataset.file, add = document.getElementById('alines').value.trim();
    if (!add) return; btn.disabled = true; msg.textContent = 'Записую у файл на GitHub…';
    try { const n = await ghAppend(file, add, lsGet('ghtoken', null));
      msg.textContent = n ? `Готово: додано рядків — ${n}, у файл ${file}. Доступ запрацює за хвилину-дві.` : 'Ці адреси вже є у файлі, нічого не змінено.'; btn.hidden = true;
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false; };
  document.getElementById('acopy').onclick = async () => { const t = document.getElementById('alines');
    try { await navigator.clipboard.writeText(t.value); msg.textContent = 'Скопійовано.'; } catch (e) { t.select(); msg.textContent = 'Рядки виділено: натисніть Ctrl+C.'; } };
}
function wireVerify(){

    const files = [...e.target.files], out = document.getElementById('vfout'); if (!files.length) return;
    out.innerHTML = '<p class="hint">Перевіряю…</p>'; const rows = [];

};

/* ---------- exercises, format 2 (pairs / rows / inline cloze, true-false list, categorize) ---------- */
const pw = n => { const a=n%10,b=n%100; return (a===1&&b!==11)?'бал':(a>=2&&a<=4&&(b<10||b>=20))?'бали':'балів'; };
function zone2(cls=''){ const s=el('div',{class:'slot'}); const z=el('div',{class:'zone '+cls},s); z._slot=s; return z; }
function poolBox(title){ const s=el('div',{class:'slot'}); const p=el('div',{class:'pool'},el('div',{class:'ptitle'},title),s); p._slot=s; return p; }
function scoreRow(got,max){ const s=el('div',{class:'score'},el('div',{class:'sbar'},el('i')),el('b',{},`${got} з ${max} ${pw(max)}`)); requestAnimationFrame(()=>s.querySelector('i').style.width=(max?got/max*100:0)+'%'); return s; }
function DnD(cards, zoneEls, pool, {multi=false}={}){
  const all=[...zoneEls,pool], cardEls={}; let place={}, order=[], selected=null, locked=false;
  cards.forEach(c=>{ const ce=el('div',{class:'dcard',tabindex:'0',role:'button'},c.text); ce._id=c.id; cardEls[c.id]=ce;
    ce.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(c.id);}}); pointer(ce); });
  all.forEach((z,i)=>{ z._idx=z===pool?null:i; z.tabIndex=0;
    z.addEventListener('click',e=>{if(!e.target.closest('.dcard'))drop(z._idx);});
    z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===z){e.preventDefault();drop(z._idx);}}); });
  function draw(){ all.forEach(z=>z._slot.querySelectorAll('.dcard:not(.sol)').forEach(n=>n.remove()));
    order.forEach(id=>{(place[id]==null?pool:zoneEls[place[id]])._slot.append(cardEls[id]);cardEls[id].classList.toggle('sel',selected===id);});
    pool.hidden=locked&&order.every(id=>place[id]!=null); }
  function toggle(id){if(locked)return;selected=selected===id?null:id;draw();}
  function move(id,zi){ if(locked)return; if(!multi&&zi!=null){const occ=order.find(x=>place[x]===zi&&x!==id); if(occ)place[occ]=place[id]??null;}
    place[id]=zi;selected=null;draw(); api.onchange&&api.onchange(); }
  function drop(zi){if(selected!=null)move(selected,zi);}
  function pointer(ce){
    let sx=null,sy,drag=false,fly,ox,oy,hot=null;
    ce.addEventListener('pointerdown',e=>{if(locked||e.button>0)return;sx=e.clientX;sy=e.clientY;drag=false;ce.setPointerCapture(e.pointerId);});
    ce.addEventListener('pointermove',e=>{ if(sx==null)return;
      if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){ drag=true;const r=ce.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
        fly=ce.cloneNode(true);fly.className='dcard flying';fly.style.width=r.width+'px';document.body.append(fly);ce.classList.add('ghost'); }
      if(drag){fly.style.left=(e.clientX-ox)+'px';fly.style.top=(e.clientY-oy)+'px';
        const t=at(e.clientX,e.clientY);if(hot!==t){hot&&hot.classList.remove('hot');hot=t;hot&&hot.classList.add('hot');}} });
    const end=e=>{ if(sx==null)return;
      if(drag){fly.remove();ce.classList.remove('ghost');hot&&hot.classList.remove('hot');const t=at(e.clientX,e.clientY);if(t)move(ce._id,t._idx);}
      else if(e.type==='pointerup')toggle(ce._id);
      sx=null;drag=false;hot=null; };
    ce.addEventListener('pointerup',end);ce.addEventListener('pointercancel',end);
  }
  function at(x,y){const n=document.elementFromPoint(x,y);const z=n&&n.closest('.zone,.pool');return all.includes(z)?z:null;}
  const api={ place:()=>place, inZone:zi=>order.filter(id=>place[id]===zi),
    reset(){locked=false;selected=null;all.forEach(z=>z._slot.querySelectorAll('.sol').forEach(n=>n.remove()));
      order=shuffle(cards.map(c=>c.id));order.forEach(id=>{place[id]=null;cardEls[id].classList.remove('ok','bad');});draw();},
    lock(){locked=true;selected=null;draw();}, mark(id,ok){cardEls[id].classList.add(ok?'ok':'bad');} };
  api.reset(); return api;
}
function controls(root,{check,reset,solution,fbFull,fbFail,report}){
  const out=el('div');
  const checkBtn=el('button',{class:'primary',type:'button'},'Перевірити');
  const solBtn=solution?el('button',{type:'button',hidden:true},'Показати розв’язок'):null;
  const retryBtn=el('button',{type:'button'},'Повторити');
  const bar=el('div',{class:'actions'},checkBtn,solBtn,retryBtn);
  checkBtn.onclick=()=>{ const {got,max}=check(); checkBtn.disabled=true;
    bar.append(scoreRow(got,max)); if(solBtn&&got<max) solBtn.hidden=false;
    out.innerHTML=''; const t=got===max?fbFull:fbFail; if(t) out.append(el('div',{class:'feedback'},t)); report&&report(got,max); };
  if(solBtn) solBtn.onclick=()=>{solution();solBtn.hidden=true;};
  retryBtn.onclick=()=>{reset();checkBtn.disabled=false;bar.querySelector('.score')?.remove();solBtn&&(solBtn.hidden=true);out.innerHTML='';};
  root.append(bar,out);
}
function Cloze(ex){
  const root=el('div',{class:'v2'}); const blanks=[];
  const mk=(answer,cls,note)=>{const z=zone2(cls);blanks.push({answer,zone:z,note});return z;};
  let hintText='Перетягніть варіант у поле або натисніть варіант, а потім поле.';
  if(ex.layout==='pairs'){
    const g=el('div',{class:'pairs'},el('div',{class:'colhead'},ex.slotLabel),el('div',{class:'colhead'},ex.textLabel));
    ex.rows.forEach(r=>g.append(mk(r.answer),el('div',{class:'desc'},r.text))); root.append(g);
  } else if(ex.layout==='rows'){
    root.append(el('div',{class:'rows'},ex.rows.map(r=>{ const note=r.note?el('div',{class:'note',hidden:true},r.note):null;
      return el('div',{class:'row'}, r.lead?el('div',{class:'lead'},r.lead):null, el('p',{class:'txt'},r.text),
        el('div',{class:'ansline'},el('span',{},ex.slotLabel),mk(r.answer,'',note)), note); })));
  } else {
    root.append(el('div',{class:'cloze'},ex.paras.map(p=>el('p',{},p.map(part=>typeof part==='string'?part:mk(part.answer,'inline'))))));
    hintText='Перетягніть слово в пропуск або натисніть слово, а потім пропуск. Деякі слова зайві.';
  }
  const words=[...blanks.map(b=>b.answer),...(ex.distractors||[])].map((t,i)=>({id:String(i),text:t}));
  const text=id=>words[+id].text;
  const pool=poolBox(hintText); root.append(pool);
  const d=DnD(words,blanks.map(b=>b.zone),pool);
  controls(root,{ report:ex._report, fbFull:ex.fbFull, fbFail:ex.fbFail,
    check(){ d.lock(); let got=0; blanks.forEach((b,zi)=>{ const id=d.inZone(zi)[0]; if(id!=null){const ok=text(id)===b.answer; d.mark(id,ok); got+=ok;} if(b.note) b.note.hidden=false; }); return {got,max:blanks.length}; },
    reset(){ d.reset(); blanks.forEach(b=>b.note&&(b.note.hidden=true)); },
    solution: ex.solution ? ()=>blanks.forEach((b,zi)=>{ const id=d.inZone(zi)[0]; if(id==null||text(id)!==b.answer) b.zone._slot.append(el('div',{class:'dcard sol'},b.answer)); }) : null });
  return root;
}
function Categorize(ex){
  const root=el('div',{class:'v2'});
  const zs=ex.zones.map(z=>{const x=zone2();x.prepend(el('div',{class:'zlabel'},z.label));return x;});
  root.append(el('div',{class:'cats',style:`grid-template-columns:repeat(${zs.length},minmax(0,1fr))`},zs));
  const pool=poolBox('Твердження: перетягніть або натисніть твердження, а потім категорію'); root.append(pool);
  const d=DnD(ex.cards,zs,pool,{multi:true});
  controls(root,{ report:ex._report,
    check(){ d.lock(); let sc=0; ex.zones.forEach((z,zi)=>d.inZone(zi).forEach(id=>{const ok=z.correct.includes(id);d.mark(id,ok);sc+=ok?1:-1;})); return {got:Math.max(0,sc),max:ex.cards.length}; },
    reset(){ d.reset(); }, fbFull:ex.fbFull, fbFail:ex.fbFail });
  return root;
}
function TrueFalse(ex){
  const root=el('div',{class:'v2'}); const list=el('div',{class:'tf'}); root.append(list);
  const sum=el('div',{class:'actions'}); let ans;
  function draw(){ list.innerHTML='';
    ex.questions.forEach((q,i)=>{ const a=ans[i];
      const btn=(label,val)=>el('button',{type:'button',class:a==null?'':a===val?(val===q.ok?'ok':'bad'):'',disabled:a!=null,onclick:()=>{ans[i]=val;draw();}},label);
      list.append(el('div',{class:'tfq'},el('p',{},q.q),el('div',{class:'btns'},btn('✅ Правда',true),btn('❌ Неправда',false)),
        a!=null?el('div',{class:'fb '+(a===q.ok?'ok':'bad')},a===q.ok?q.fbOk:q.fbBad):null)); });
    sum.innerHTML='';
    if(ans.every(x=>x!=null)){ const got=ans.filter((x,i)=>x===ex.questions[i].ok).length;
      sum.append(scoreRow(got,ex.questions.length),el('button',{type:'button',onclick:reset},'Повторити')); ex._report&&ex._report(got,ex.questions.length); } }
  function reset(){ans=ex.questions.map(()=>null);draw();}
  root.append(sum); reset(); return root;
}
function MultiSet(ex){
  const root=el('div',{class:'v2'}); const qs=ex.questions; let chosen, locked, solShown=false;
  const list=el('div',{class:'mset'}); root.append(list);
  function draw(){ list.innerHTML='';
    qs.forEach((q,qi)=>{ const opts=q.order.map(i=>{ const o=q.options[i], on=chosen[qi].has(i);
        const inp=el('input',{type:'checkbox',disabled:locked}); inp.checked=on;
        inp.addEventListener('change',()=>{ inp.checked?chosen[qi].add(i):chosen[qi].delete(i); draw(); });
        let cls='opt'; if(locked){ if(on) cls+=o.ok?' ok':' bad'; else if(o.ok&&solShown) cls+=' miss'; } else if(on) cls+=' chosen';
        return el('label',{class:cls},inp,el('span',{},o.t),el('span',{class:'mark'},locked&&on?(o.ok?'✓':'✗'):(locked&&o.ok&&solShown&&!on?'пропущено':''))); });
      list.append(el('div',{class:'mq-wrap'},el('p',{class:'mq'}, q.lead?el('b',{},q.lead+' '):null, q.q),q.ask?el('p',{class:'mask'},q.ask):null,el('div',{class:'opts2'},opts))); }); }
  const score=qi=>{ let sc=0; chosen[qi].forEach(i=>sc+=qs[qi].options[i].ok?1:-1); return Math.max(0,sc); };
  const init=()=>{ chosen=qs.map(()=>new Set()); locked=false; solShown=false; qs.forEach(q=>q.order=shuffle(q.options.map((_,i)=>i))); draw(); };
  controls(root,{ report:ex._report, fbFull:ex.fbFull, fbFail:ex.fbFail,
    check(){ locked=true; draw(); return {got:qs.reduce((a,_,qi)=>a+score(qi),0), max:qs.reduce((a,q)=>a+q.options.filter(o=>o.ok).length,0)}; },
    reset(){ init(); }, solution(){ solShown=true; draw(); } });
  init(); return root;
}
function buildEx2(host, list, onReport){

    const s=el('section',{class:'ex'},el('div',{class:'intro',html:ex.intro}));

function buildQuiz(host, DATA, onReport){
  const QS=DATA.questions, app=el('div',{class:'qz'}); host.append(el('section',{class:'ex'},
    el('p',{class:'qsub'},`${QS.length} запитань · для зарахування потрібно ${passOf(DATA._id) || DATA.pass}%`), app));
  function makeQuestion(q, idx){
    const body=el('div'); const head=[el('div',{class:'qnum'},`Запитання ${idx+1} із ${QS.length}`), el('p',{class:'qq'},q.q)]; let api;
    if(q.type==='single'||q.type==='multi'){
      const multi=q.type==='multi', nOk=q.options.filter(o=>o.ok).length, order=shuffle(q.options.map((_,i)=>i)), chosen=new Set(); let locked=false;
      const name='q'+idx+'-'+Math.random().toString(36).slice(2,7);
      const rows=order.map(i=>{ const inp=el('input',{type:multi?'checkbox':'radio',name}); const row=el('label',{class:'opt'}, inp, el('span',{},q.options[i].t), el('span',{class:'mark'}));
        inp.addEventListener('change',()=>{ if(locked) return; if(!multi) chosen.clear(); inp.checked?chosen.add(i):chosen.delete(i); paint(); api.onchange&&api.onchange(); });
        row._i=i; row._inp=inp; return row; });
      function paint(){ rows.forEach(r=>r.classList.toggle('chosen',chosen.has(r._i))); }
      head.push(el('p',{class:'qhint'}, multi?(q.hideCount?'Оберіть усі правильні відповіді.':`Оберіть кілька відповідей (правильних: ${nOk}).`):'Оберіть одну відповідь.'));
      body.append(el('div',{class:'opts2'},rows));
      api={ max:multi?nOk:1, answered:()=>chosen.size>0,
        score(){ let sc=0; chosen.forEach(i=>sc+=q.options[i].ok?1:-1); return multi?Math.max(0,sc):(sc>0?1:0); },
        lock(){ locked=true; rows.forEach(r=>{ r._inp.disabled=true; r.classList.add('locked');
          if(chosen.has(r._i)){ const ok=q.options[r._i].ok; r.classList.remove('chosen'); r.classList.add(ok?'ok':'bad'); r.querySelector('.mark').textContent=ok?'✓':'✗'; } }); },
        yours:()=>chosen.size?[...chosen].map(i=>q.options[i].t).join('; '):null, right:()=>q.options.filter(o=>o.ok).map(o=>o.t).join('; ') };

      el('div',{class:'actions'}, solBtn, el('button',{type:'button',class:'primary',onclick:start},'Повторити')), review));

  let h = '';
  if (COUNTABLE.includes(o)) h += `<div class="done"><span>${done[o.id]?'Цей крок позначено як виконаний.':'Опрацювали цей крок?'}</span><button type="button" id="donebtn" aria-pressed="${!!done[o.id]}">${done[o.id]?'✓ Виконано':'Позначити як виконане'}</button></div>`;
  h += `<nav class="pager" aria-label="Навігація сторінками">${prev?`<a href="#${prev.id}"><small>← Назад</small>${prev.num?prev.num+' ':''}${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="next" href="#${next.id}"><small>Далі →</small>${next.num?next.num+' ':''}${esc(next.title)}</a>`:''}</nav>`;
  return h;
}
function render(){
  let id = location.hash.slice(1);
  const v = document.getElementById('view');
  if (id === 'verify') { location.replace('#materials'); return; }
  if (!BYID[id]) id = 'home';
  const o = BYID[id];
  let h;
  if (o.kind === 'home') h = home();
  else if (o.kind === 'module') h = moduleView(o.mod);
  else if (o.kind === 'methods') h = methodsView();
  else {
    const crumb = o.mod ? `<a href="#home">Курс</a> · <a href="#${o.mod.id}">Модуль ${o.mod.n}</a>` : `<a href="#home">Курс</a>`;
    h = `<p class="crumb">${crumb}</p><h1>${o.num?o.num+' ':''}${esc(o.title)}</h1>`;
    if (o.kind === 'page') h += `<div class="content">${P[o.src]}</div>`;
    else if (o.kind === 'task') h += `<div class="content">${o.html}</div>` + (o.tool==='verify' ? verifyHTML() + (USER.owner ? accessHTML() : '') : '');
    else if (o.kind === 'rubric') h += rubricHTML(o.id);
    else if (o.kind === 'template') h += templateHTML(o.id);
    else if (o.kind === 'ex') h += `<div class="exw" id="exw"></div>`;
    else if (o.kind === 'doctool') h += `<div class="exw dt" id="dt"></div>`;
    else if (o.kind === 'test') h += `<p class="content">Прохідний результат — ${passOf(o.id)}%. Тест можна проходити повторно, зараховується найкращий результат.</p><div class="testscore" id="testscore">${testScoreHTML(o.id)}</div><div class="exw" id="exw"></div>`;
    else if (o.kind === 'cert') h += certView();
    else if (o.kind === 'h5p') h += h5pView(o);
    else if (o.kind === 'form') h += formView(o);
  }
  if (o.kind !== 'home') h += footer(o);
  v.innerHTML = h;
  if (CAN_EMBED) v.querySelectorAll('a.video').forEach(a => { const id = new URL(a.href).searchParams.get('v'); const f = document.createElement('iframe'); f.className = 'video'; f.src = 'https://www.youtube-nocookie.com/embed/' + id; f.title = 'Відео YouTube'; f.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; f.allowFullscreen = true; f.loading = 'lazy'; a.replaceWith(f); });
  renderIndex(id);
  wire(o);
  document.body.classList.remove('open'); document.getElementById('menu').setAttribute('aria-expanded','false');
  window.scrollTo(0, 0);
}
/* ---------- progress file: encrypted with a key from the participant's e-mail ---------- */
const P_SKIP = ['user', 'ghtoken'];
async function pKey(){ const base = await crypto.subtle.importKey('raw', te.encode(USER.email), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:te.encode('FormA-progress-v1'), iterations:A_ITER}, base, 256)); }
function pCollect(){ const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
  if (k.startsWith(NS)) o[k.slice(NS.length)] = localStorage.getItem(k); } } catch (e) {} return o; }
async function pSave(){
  const body = await aSeal(await pKey(), te.encode(JSON.stringify({email: USER.email, at: new Date().toISOString(), data: pCollect()})));
  const blob = new Blob([JSON.stringify({app:'FormA', v:1, data:body})], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `FormA_прогрес_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function pLoad(file){
  let j; try { j = JSON.parse(await file.text()); } catch (e) { throw new Error('Це не файл прогресу курсу FormA.'); }
  if (!j || j.app !== 'FormA' || !j.data) throw new Error('Це не файл прогресу курсу FormA.');
  let d; try { d = JSON.parse(new TextDecoder().decode(await aOpen(await pKey(), j.data))); }
  catch (e) { throw new Error('Цей файл збережено для іншої адреси, тож відкрити його тут не можна.'); }
  if (d.email !== USER.email) throw new Error('Цей файл збережено для іншої адреси, тож відкрити його тут не можна.');
  for (const [k, v] of Object.entries(d.data || {})) if (!P_SKIP.includes(k)) { try { localStorage.setItem(NS + k, v); } catch (e) {} }
  done = store.get('done', {}); return d.at;
}
let toastT;
function toast(t){ const el_ = document.getElementById('toast'); el_.textContent = t; el_.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el_.hidden = true; }, 6000); }
function wireProgress(){
  const sv = document.getElementById('psave'), ld = document.getElementById('pload');
  sv.hidden = !CAN_EMBED;
  sv.onclick = async () => { try { await pSave(); toast('Файл прогресу збережено. Він відкривається лише з вашою адресою.'); } catch (e) { toast('Не вдалося зберегти файл.'); } };
  ld.onchange = async () => { const f = ld.files[0]; if (!f) return;
    try { const at = await pLoad(f); render(); toast(`Прогрес відновлено (збережено ${new Date(at).toLocaleString('uk-UA')}).`); }
    catch (e) { toast(e.message); } ld.value = ''; };
}
wireProgress();
function wire(o){
  const b = document.getElementById('donebtn');
  if (b) b.onclick = () => {
    const nowDone = !done[o.id];
    if (nowDone) done[o.id] = true; else delete done[o.id];
    store.set('done', done);
    const next = ORDER[ORDER.indexOf(o) + 1];
    if (nowDone && next) location.hash = next.id; else render();
  };
  const ex = document.getElementById('exw');
  if (EX[o.ex] && EX[o.ex].questions) EX[o.ex]._id = o.id;
  if (ex && o.kind === 'test') buildExercises(ex, EX[o.ex], testReporter(o));
  else if (ex) buildExercises(ex, EX[o.ex]);
  if (o.kind === 'cert') wireCert();
  if (o.kind === 'doctool') buildDocTool(document.getElementById('dt'), EX[o.ex], o.id);
  if (o.tool === 'verify') { wireVerify(); if (USER.owner) wireAccess(); }
  const rb = document.getElementById('rubric');
  if (rb) wireRubric(rb, o.id);
  const tp = document.getElementById('template');
  if (tp) wireTemplate(tp, o.id);
  const t = document.getElementById('notes');
  if (t) {
    let tm; t.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { store.set('note-'+o.id, t.value); document.getElementById('notemsg').textContent = 'Збережено в цьому браузері.'; }, 400); };
    document.getElementById('copynote').onclick = async () => { const m = document.getElementById('notemsg');
      try { await navigator.clipboard.writeText(t.value); m.textContent = 'Скопійовано.'; } catch(e) { t.select(); m.textContent = 'Текст виділено: натисніть Ctrl+C, щоб скопіювати.'; } };
  }
  const f = document.getElementById('sa');
  if (f) {
    const upd = () => { const ans = {}; QUESTIONS.forEach((q, i) => { const c = f.querySelector(`input[name="q${i}"]:checked`); if (c) ans[i] = +c.value; });
      store.set('sa-'+o.phase, ans); const n = Object.keys(ans).length;
      document.getElementById('savedmsg').textContent = n === QUESTIONS.length ? '✓ Усі відповіді збережено в цьому браузері.' : `Відповіді: ${n} із ${QUESTIONS.length}`;
      if (n === QUESTIONS.length && !done[o.id]) { done[o.id] = true; store.set('done', done); renderIndex(o.id); const db = document.getElementById('donebtn'); if (db){ db.setAttribute('aria-pressed','true'); db.textContent='✓ Виконано'; } }
      const c = document.getElementById('compare'); if (c) c.innerHTML = compareHTML(); };
    f.onchange = upd;
    const c = document.getElementById('compare'); if (c) c.innerHTML = compareHTML();
  }
}
document.getElementById('menu').onclick = () => { const o = document.body.classList.toggle('open'); document.getElementById('menu').setAttribute('aria-expanded', o); };
window.addEventListener('hashchange', render);
render();
}
boot();
